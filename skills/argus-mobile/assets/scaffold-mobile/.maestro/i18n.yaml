appId: ${APP_ID}
name: Argus — i18n et formats
tags:
  - argus
  - i18n
---
# Langue, format monétaire, longueur du français.
#
# ⚠️ La locale NE SE CHANGE PAS depuis un flow. `--device-locale` n'existe que
# sur `maestro start-device` et `maestro cloud` — pas sur `maestro test`, et la
# doc précise qu'aucun endroit d'un flow (ni `launchApp`, ni `config.yaml`) ne
# permet de la définir. Le runner démarre donc le device dans la locale de
# `argus.mobile.yaml → locale.deviceLocale`, et ce flow vérifie le RÉSULTAT.
#
# ⚠️ Le débordement dû à la longueur du français ne se voit pas ici : rien ne
# « déborde » au sens de Maestro, le texte est simplement tronqué ou replié, ce
# qui n'échoue nulle part. C'est test/argus_layout_test.dart qui le mesure, à
# 100 %, 130 % et 200 % de taille de texte.

- runFlow: _subflows/launch-clean.yaml

- runFlow:
    when:
      true: "${typeof ARGUS_ANCHOR_HOME !== 'undefined' && ARGUS_ANCHOR_HOME !== ''}"
    commands:
      - extendedWaitUntil:
          visible:
            id: ${ARGUS_ANCHOR_HOME}
          timeout: 20000

      # TODO(argus): asserte un libellé qui PROUVE la locale, c'est-à-dire un
      # texte qui serait différent en anglais. Un mot identique dans les deux
      # langues ne prouve rien.
      # - assertVisible:
      #     text: 'Bienvenue'
      #     label: Interface rendue en français

      # TODO(argus): asserte le format monétaire XOF tel que ton app le rend.
      # Le séparateur de milliers du français est une espace insécable étroite
      # (U+202F) sur les Flutter récents, PAS une espace ordinaire : un
      # `assertVisible` écrit avec une espace normale échoue sans qu'on comprenne
      # pourquoi. Les sélecteurs `text` étant des regex, `\s` couvre les deux.
      # - assertVisible:
      #     text: '1\s?234\s?567\s?FCFA'
      #     label: Montant formaté en FCFA (séparateur insécable toléré)

      # Clés de traduction manquantes : une clé non résolue se rend en clair.
      # Ce garde attrape les formes les plus courantes.
      - assertNotVisible:
          text: '(?i)(missing[_ ]translation|\[\[.*\]\]|__[A-Z_]+__)'
          label: Aucune clé de traduction non résolue à l'écran

- runFlow:
    when:
      true: "${typeof ARGUS_ANCHOR_HOME === 'undefined' || ARGUS_ANCHOR_HOME === ''}"
    commands:
      - assertTrue:
          condition: "${true}"
          label: 'SKIP i18n — aucune ancre déclarée dans argus.mobile.yaml'
