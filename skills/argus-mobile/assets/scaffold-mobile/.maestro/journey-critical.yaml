appId: ${APP_ID}
name: Argus — parcours critique
tags:
  - argus
  - functional
  - p0
---
# Le parcours métier qui, s'il casse, fait perdre de l'argent ou des utilisateurs.
# C'est le SEUL flow que personne ne peut écrire à ta place : il encode ton
# domaine.
#
# ⚠️ GARDE-FOU NON NÉGOCIABLE (SKILL.md §5) : aucun mouvement d'argent réel ici.
# Pas de transfert, pas de retrait, pas de paiement marchand — même en staging,
# même « pour voir ». Achats in-app : sandbox StoreKit / Google Play Billing
# UNIQUEMENT. Si le parcours critique de ton app EST un paiement, arrête-toi et
# fais valider le protocole par écrit avant d'écrire la moindre ligne ici.

- runFlow: _subflows/launch-clean.yaml
- runFlow: _subflows/login.yaml

- runFlow:
    when:
      true: "${typeof ARGUS_ANCHOR_HOME !== 'undefined' && ARGUS_ANCHOR_HOME !== ''}"
    commands:
      - extendedWaitUntil:
          visible:
            id: ${ARGUS_ANCHOR_HOME}
          timeout: 20000
          label: Point de départ du parcours

      # TODO(argus): écris ici le parcours P0, une étape = une assertion.
      # Trois règles qui font la différence entre un test utile et un test flaky :
      #
      #   1. Attendre un ÉTAT, jamais un délai — `extendedWaitUntil` sur l'ancre
      #      de l'écran suivant, pas un sleep.
      #   2. Cibler par `id` (Semantics identifier), jamais par texte affiché : le
      #      texte change avec la langue et avec le prochain arbitrage produit.
      #   3. Asserter APRÈS chaque transition, pas seulement à la fin — sinon un
      #      échec au milieu remonte comme un échec de la dernière étape.
      #
      # - tapOn:
      #     id: cta_start
      #     label: Démarrer le parcours
      # - extendedWaitUntil:
      #     visible:
      #       id: step_two_root
      #     timeout: 15000
      # - assertVisible:
      #     id: step_two_summary
      #     label: Le récapitulatif reprend bien la saisie

      # Idempotence : un double-tap ne doit pas produire deux effets. C'est le
      # défaut le plus coûteux d'une app financière, et le moins testé.
      # - tapOn:
      #     id: cta_confirm
      # - tapOn:
      #     id: cta_confirm
      #     optional: true
      # - assertVisible:
      #     id: confirmation_unique
      #     label: Une seule confirmation après deux appuis

- runFlow:
    when:
      true: "${typeof ARGUS_ANCHOR_HOME === 'undefined' || ARGUS_ANCHOR_HOME === ''}"
    commands:
      - assertTrue:
          condition: "${true}"
          label: 'SKIP parcours critique — aucune ancre configurée dans argus.mobile.yaml'
