# ═══════════════════════════════════════════════════════════════════════════
# argus.mobile.yaml — réglages du harness QA mobile, spécifiques à l'application.
# ARGUS:OWNED — à toi : l'installeur ne l'écrase ni ne le compare, jamais.
#
# C'est la SOURCE UNIQUE DE LA CONFIGURATION : tous les scripts
# (`scripts/argus/*.mjs`) et tous les flows Maestro lisent depuis ici.
#
# Ce n'est pas pour autant le seul fichier à éditer, et le prétendre fait
# chercher ailleurs ce qu'on ne trouve pas. Les autres portent du CODE et des
# PARCOURS, qui n'ont pas leur place dans du YAML :
#   test/argus/harness.dart       les écrans à monter, les polices, le thème
#   test/argus/known_issues.dart  la dette que les gardes révèlent
#   .maestro/*.yaml marqués OWNED les parcours métier
# `install-mobile.sh` te les liste en sortant, avec les `TODO(argus)` restants.
# ⚠️ Un TODO se FERME, il ne se supprime pas — trois façons, toutes exclues du
# compteur : `SANS OBJET — …` (rien à faire ici), `FAIT — …` (rempli, et la doc
# au-dessus vaut d'être gardée), `TRAITÉ — …` (écrit ailleurs).
#
# Les valeurs sensibles n'ont RIEN à faire dans ce fichier. Les identifiants de
# test viennent de l'environnement (voir `auth.secretsFromEnv`) et sont injectés
# aux flows par le runner via `maestro test -e KEY=…`.
#
# SOUS-ENSEMBLE YAML ACCEPTÉ (scripts/argus/config.mjs, sans dépendance) :
#   commentaires · maps imbriquées · listes (bloc `- x` et flow `[a, b]`)
#   chaînes nues ou quotées · entiers · flottants · true/false · null/~
# NON accepté, et signalé par une erreur explicite plutôt que mal interprété :
#   ancres/alias (&, *) · blocs multi-lignes (|, >) · maps en flow ({a: 1})
#   `yes`/`no`/`on`/`off` nus (ambigus en YAML 1.1 — écris true/false)
#   chaînes QUOTÉES repliées sur plusieurs lignes — cette forme-ci manquait à la
#   liste, et un run l'a rencontrée sur `evidenceAcknowledged`, dont le
#   commentaire invite à écrire une phrase. Une valeur tient sur UNE ligne ;
#   si elle est longue, raccourcis-la, elle est faite pour être relue.
# ═══════════════════════════════════════════════════════════════════════════

# ── Le cadrage de ce run ───────────────────────────────────────────────────
# `env`  : local | staging | prod — commande les garde-fous, pas le niveau de
#          détail. `local` autorise les écritures et l'effacement des données de
#          l'app ; si ton app pointe ailleurs que vers des données jetables,
#          `local` est une DÉCISION, pas un défaut.
# `mode` : REGRESS installer la garde | EXPLORE auditer sans rien laisser |
#          DEMO filmer.
# Les deux sont recopiés tels quels dans `run.env` / `run.mode` du rapport :
# c'est ce qui permet de relire un rapport sans deviner sous quel régime il a
# été produit. ⚠️ Ces clés ont manqué neuf runs — le contrat de sortie les
# promettait, rien ne les écrivait, et deux agents de suite ont rangé le cadrage
# en commentaire d'en-tête faute d'endroit où le mettre.
run:
  env: local
  mode: REGRESS

# ── L'application sous test ────────────────────────────────────────────────
app:
  # Le nom que l'application AFFICHE — pas celui du paquet Dart.
  # ⚠️ C'est lui qui va dans le TITRE de la page publiée, donc la seule chose qui
  # distingue ton rapport des autres dans une galerie. `acme_colis` et
  # `zen_timer` sont des identifiants techniques ; « Acme Colis » et
  # « Zen Timer » sont des noms. Vécu : un titre publié disait « Colis ».
  # Où le lire : ios/Runner/Info.plist → CFBundleDisplayName, ou côté Android
  # `resValue("string", "app_name", …)` du build.gradle, ou <string name="app_name">
  # d'un strings.xml, ou android:label s'il porte un littéral.
  # `node scripts/argus/argus-mobile.mjs config` te le signale s'il reste sur le nom du paquet.
  name: mon_app
  # Identifiant Android (applicationId) et iOS (CFBundleIdentifier). C'est ce que
  # Maestro met dans `appId:` en tête de chaque flow. REQUIS pour la plateforme
  # que tu testes ; laisse vide celle que tu ne testes pas.
  # Retrouve-les : android/app/build.gradle(.kts) → applicationId
  #                ios/Runner.xcodeproj → PRODUCT_BUNDLE_IDENTIFIER
  androidPackage: ''   # TODO(argus): ex. com.exemple.monapp
  iosBundleId: ''      # TODO(argus): ex. com.exemple.monapp
  # Flavor / scheme testé. Vide si le projet n'en a pas.
  flavor: ''

# ── Le binaire à installer ─────────────────────────────────────────────────
# Maestro N'INSTALLE PAS l'application : il pilote un binaire déjà présent sur
# le device. C'est le runner qui installe (adb install -r / xcrun simctl install)
# et qui VÉRIFIE que l'installation a réussi — `adb install` peut échouer en
# silence et laisser tourner la version précédente.
build:
  android: build/app/outputs/flutter-apk/app-debug.apk
  # ⚠️ CE QU'ON INSTALLE ≠ CE QU'ON ANALYSE. La clé ci-dessus décide de ce que le
  # runner POSE sur l'appareil — un debug, presque toujours. Le scan de sécurité,
  # lui, ne conclut que sur la PUBLICATION : sur un debug il se saute, avec sa
  # raison. Renseigne alors le binaire de release ici, une fois pour toutes,
  # plutôt que d'éditer la ligne du dessus entre deux runs :
  # androidScan: build/app/outputs/flutter-apk/app-release.apk
  # (ponctuellement : `node scripts/argus/argus-mobile.mjs sec --binary=<chemin>`)
  #
  # Elle décide AUSSI de la taille que pèse `argus-perf` : le budget
  # `binarySizeMb` vise la publication, donc sans cette clé le rapport ne juge
  # rien — il RÉCLAME la mesure (QAM-PERF-SIZE-UNMEASURED) au lieu d'appliquer
  # un budget de release au binaire de test, qui en fait couramment le triple.
  #
  # ⚠️ CONSTRUIS-LE AVEC LA COMMANDE DE RELEASE DU PROJET, pas un `--release` nu.
  # Le scan conclut sur le binaire qu'on lui donne : construit sans les flags que
  # ton projet emploie pour publier (typiquement `--obfuscate
  # --split-debug-info`, souvent avec un `--dart-define-from-file`), il rend un
  # finding « Binaire AOT non obfusqué » qui décrit TA COMMANDE et non ton
  # application. Vécu : 76 chemins `package:…` lisibles avec un `--release` nu,
  # **0** après reconstruction avec les flags documentés du projet — même code,
  # seuls les flags changeaient. Ce finding-là serait parti en rapport comme un
  # défaut de l'app.
  #
  # Cherche la commande dans le dépôt (script de release, CI, doc de
  # déploiement) avant d'en inventer une, et note ici celle que tu as employée.
  #
  # 🔴 ET IL Y A UNE CLÉ POUR LA PORTER (467) :
  #   androidScanBuildCmd: flutter build apk --release --obfuscate --split-debug-info=build/sym
  #   iosScanBuildCmd:     flutter build ipa --release --flavor prod
  # Renseignée, elle est rendue TELLE QUELLE par `releaseBuildCmd`, donc c'est
  # elle que le harnais conseille quand une dimension réclame la publication.
  # Vide, il DÉRIVE la commande de debug ci-dessous en échangeant le mode — ce
  # qui garde ton ABI, ton flavor et tes `--dart-define`, mais **ne peut pas
  # inventer** `--obfuscate` ni `--split-debug-info`, qui ne figurent dans aucune
  # commande de debug. D'où un `--release` nu, un binaire non obfusqué, et un
  # `major` qui décrit LA COMMANDE et non l'application.
  #
  # ⚠️ Deux runs s'y sont arrêtés avant qu'elle existe : l'un a trouvé la commande
  # dans un `SENTRY.md §7` et n'a pas su où la reporter ; l'autre a créé cette
  # clé, mesuré qu'aucun script ne la lisait, et l'a RETIRÉE — il avait raison à
  # l'époque, une clé que rien ne lit se relit comme un geste outillé alors qu'il
  # ne l'est pas (point 11). Elle a désormais un lecteur.
  #
  # Note aussi sa SOURCE juste au-dessus, en commentaire, sous cette forme :
  #     # construit par : <commande>  (source : <fichier §>)
  # La clé porte la commande, elle ne porte pas d'où elle vient — et sans ça, le
  # suivant la cherchera au même endroit que toi, qui n'est jamais le même selon
  # les projets.
  # ⚠️ UN FLAVOR DÉPLACE CE CHEMIN, et le défaut ci-dessous n'en porte aucun.
  # ⇒ DEMANDE-LE AU DISQUE plutôt que de le deviner, c'est le seul geste sûr :
  #     find build/ios -name Runner.app -maxdepth 2
  # Le segment de configuration REMPLACE `iphonesimulator/`, il ne s'y ajoute
  # pas — d'où les chemins ENTIERS ci-dessous, un segment nu se lisant de deux
  # façons dont une seule existe (417) :
  #   flutter build ios --flavor dev            → build/ios/Debug-dev-iphonesimulator/Runner.app
  #   flutter build ios --release --flavor dev  → build/ios/Release-dev-iphoneos/Runner.app
  # Le défaut pointe sinon un chemin qui n'existe pas, le harnais s'arrête sur
  # « AUCUN PAQUET à cet emplacement » et on cherche du côté du build. L'échec
  # est bruyant, donc il ne coûte que du temps — mais il en coûte à chaque projet
  # à flavors, et un run l'a payé deux fois (392, 417).
  ios: build/ios/iphonesimulator/Runner.app
  # Sa jumelle iOS, LUE PAR QUATRE SITES et déclarée nulle part jusqu'au run 31 :
  # un message d'erreur envoyait la renseigner, et le seul moyen d'apprendre
  # qu'elle existait était de lire le code des scripts.
  # iosScan: build/ios/iphoneos/Runner.app
  # ⚠️ `iphoneos`, pas `iphonesimulator` : c'est le build DEVICE qui se publie.
  # Un `.app` de simulateur ne dit rien de ce que reçoivent les utilisateurs —
  # il ne porte ni la même architecture ni la même signature.
  # Commandes de build. DEUX consommateurs, et ils n'en font pas la même chose :
  #   • les scripts de mesure les AFFICHENT quand le binaire manque — aucun
  #     `.mjs` n'exécute un build, ni avec ni sans confirmation ;
  #   • `make argus-build` les EXÉCUTE, après les avoir résolues
  #     (`config.mjs --print-build-cmd`) : préfixe FVM dérivé du projet, et
  #     ciblage `--target-platform` sur l'ABI du device branché.
  # ⚠️ Jusqu'au run 9, le Makefile lançait sa propre ligne, écrite en dur : la
  # valeur configurée ici n'était donc pas celle qui se construisait. Un projet
  # qui ciblait son ABI reconstruisait quand même l'APK gras — celui-là même que
  # l'installation venait de refuser.
  # Pas de `fvm` à écrire ici : le préfixe est dérivé, l'ajouter le doublerait.
  androidBuildCmd: flutter build apk --debug
  iosBuildCmd: flutter build ios --debug --simulator

# ── Ancres : l'échappatoire du contrôle POSÉ → DÉCLARÉ ─────────────────────
# `make argus-anchors` refuse une ancre posée dans lib/ que rien ne déclare —
# elle serait invisible à tout relevé. Si l'une l'est EXPRÈS (écran hors
# périmètre, ancre posée pour un outil tiers), inscris-la ici avec sa raison.
# anchors:
#   allowUndeclared:
#     - debug_overlay_root   # posée pour l'inspecteur maison, hors périmètre QA
#
# Et si ton projet pose ses ancres par un paramètre dont le nom ne finit PAS par
# « identifier » (le contrôle reconnaît `identifier`, `semanticIdentifier`,
# `accessibilityIdentifier`… par leur forme), nomme-le ici — sinon tes ancres
# de composant partagé sont invisibles, ce qui est précisément le trou que ce
# contrôle existe pour fermer.
#   paramNames: [qaId, anchorId]

# ── Plateformes activées ───────────────────────────────────────────────────
# Retire `ios` si tu n'as pas de Mac / Xcode. Une plateforme désactivée est
# rapportée `skipped`, jamais verte.
platforms:
  - android

# ── Matrice de devices ─────────────────────────────────────────────────────
# Comment la choisir sous budget : references/device-matrix.md.
#
# ⚠️ NE CIBLE PAS UN ÉMULATEUR ANDROID PAR SON udid. « emulator-5554 » est un
# NUMÉRO DE PORT, attribué dans l'ordre de démarrage : le même udid désigne un
# autre AVD dès que les émulateurs ont démarré dans un ordre différent. Ça se
# voit d'autant moins que le run se déroule normalement — sur l'app d'à côté.
# Utilise `avd`, qui est stable (liste : emulator -list-avds).
#
# `avd`        → nom d'AVD Android, la seule identité stable. Prioritaire.
# `udid`       → iOS (UUID stable) et téléphones physiques (avec physical: true).
# les deux vides → le runner prend le premier ÉMULATEUR, jamais un physique.
# `autoStart`  → démarre le device s'il n'est pas déjà là
#                (maestro start-device --device-model … --device-os …).
#                ⚠️ Incompatible avec `avd` : start-device CRÉE son propre AVD,
#                il ne sait pas démarrer le tien. Lance-le toi-même.
# `model`/`os` → DEUX consommateurs, et deux vocabulaires. Ce sont des noms MAESTRO
#                (`pixel_6`), pas ce que l'appareil rend (`sdk_gphone64_arm64`) :
#                le rapport, lui, écrit ce qu'il a MESURÉ sur le device.
#                ⚠️ ET LES DEUX CONSOMMATEURS N'ONT PAS LE MÊME VOCABULAIRE.
#                `autoStart` les passe à `maestro start-device` ; la CI les passe
#                à `android-emulator-runner`, qui attend un profil `avdmanager`.
#                Les deux nomenclatures se ressemblent assez pour qu'on ne voie
#                pas l'écart — `pixel_6` vaut des deux côtés — et assez peu pour
#                qu'un nom valide ici soit refusé là-bas. En cas de doute :
#                    avdmanager list device        # ce que la CI acceptera
#                    maestro start-device --help   # ce qu'autoStart acceptera
#                ⚠️ Avec `autoStart: false` ils ne servent pas au RUNNER — il
#                cible l'AVD nommé — mais la CI les LIT pour savoir quel
#                émulateur démarrer, et c'est ce qui fait qu'elle compare tes
#                références visuelles sur le bon appareil. Les laisser vides
#                reste légitime : le workflow retombe alors sur ses défauts, et
#                il le dit dans son journal plutôt que d'échouer.
#                (Ce commentaire disait l'inverse jusqu'au 22/08/2026 — il
#                craignait un rapport qui compare du déclaré à du mesuré. Ça
#                n'a plus lieu d'être : l'empreinte gravée à côté des
#                références est LUE SUR L'APPAREIL, jamais recopiée d'ici.)
# `role: primary` → device qui porte les baselines visuelles et les mesures perf.
devices:
  - id: android-emu
    platform: android
    # ⚠️ RENSEIGNE `avd:` — le §1 du skill demande « device = émulateur <AVD>,
    #   celui-là et aucun autre », et c'est la seule identité stable
    #   (`emulator-5554` est un numéro de port réattribué à chaque démarrage).
    #   `autoStart: false` est le défaut parce qu'il échoue BRUYAMMENT si
    #   personne n'a démarré le device, au lieu d'en créer un autre en silence :
    #   `maestro start-device` ne sait pas démarrer TON avd, il fabrique le sien.
    #   En CI, l'action qui provisionne l'émulateur l'a déjà démarré — `false`
    #   convient donc des deux côtés.
    avd: ''
    udid: ''
    model: pixel_6
    os: android-33
    autoStart: false
    role: primary
  # ⚠️ LE BLOC iOS PRESCRIVAIT `autoStart: true`, que ce fichier déconseille
  # ailleurs dès qu'un appareil est nommé — deux consignes du même fichier qui
  # se contredisaient. Un simulateur se désigne par son `udid`, qui est un UUID
  # STABLE (contrairement à un port Android), donc démarre-le toi-même et laisse
  # `autoStart: false`. Le relever : `xcrun simctl list devices available`.
  # - id: ios-sim
  #   platform: ios
  #   udid: ''            # l'UUID rendu par `xcrun simctl list devices`
  #   model: iPhone 17
  #   os: iOS-26-3
  #   autoStart: false
  #   role: secondary

# ── Écrans clés ────────────────────────────────────────────────────────────
# `anchor` = l'identifiant sémantique qui PROUVE que l'écran est affiché, posé
# côté Dart par `Semantics(identifier: 'home_root')` (Flutter ≥ 3.19).
# ⚠️ Les `Key` Flutter ne sont PAS exposées à la couche d'accessibilité : un flow
# qui cible une Key échoue. C'est le piège n°1 — voir methodology-mobile.md §6.
#
# Un écran dont `anchor` est vide est IGNORÉ par les flows (skip propre), et
# compté dans `coverage.notConfigured` du rapport. Il n'est jamais vert.
#
# `start: true` désigne l'écran d'où partent TOUS les flows, après `clearState`.
# Un seul écran peut le porter, et il lui faut une ancre — les deux sont vérifiés
# par `make argus-doctor`, sans device.
#
# ⚠️ Renseigne-le dès que tu déclares plusieurs ÉTATS d'un même écran. Sans lui,
# le runner prend l'écran d'`id: home`, et à défaut le PREMIER de la liste : si
# c'est l'état « liste pleine », son ancre n'existe pas au lancement et tous les
# flows partent de travers — par intermittence, donc en accusant autre chose. Le
# repli reste en place pour ne casser aucune config, mais il s'annonce dans la
# sortie du runner et dans `startup.origin` du rapport.
# ⚠️ ATTEIGNABLE N'EST PAS TESTÉ, ET NON ATTEINT N'EST PAS INATTEIGNABLE. Le
# rapport compte les écrans qu'un run a réellement ATTEINTS (`coverage.visited`),
# ce qui demande un device et mélange trois causes quand il en manque un. La
# seule qui se mesure sans device est « aucune branche de goto.yaml ne le
# dessert » : c'est `make argus-reach`.
#
# `reachedBy:` ferme le troisième cas, celui qui n'admet pas de branche. Après
# `clearState`, un état « liste pleine » est inatteignable par navigation — la
# donnée n'existe pas encore — et c'est le parcours qui la CRÉE qui l'atteint.
# Écris par lequel, et l'écran cesse d'être compté comme orphelin :
#
#   - id: historique-plein
#     anchor: history_filled_root
#     reachedBy: journey-critical   # créé par le parcours, pas atteint par goto
#
# Ce n'est pas un interrupteur : c'est la phrase que `goto.yaml` demande déjà
# d'écrire en prose, mise là où un outil peut la lire.
screens:
  - id: home
    anchor: ''         # TODO(argus): Semantics(identifier: '…') de l'écran d'accueil
    priority: p0
    visual: true
  - id: login
    anchor: ''         # TODO(argus): l'ancre de racine de cet écran
    priority: p0
    visual: true
  # - id: profile
  #   anchor: profile_root
  #   priority: p1
  #   visual: true

# ── Zones non déterministes ────────────────────────────────────────────────
# ⚠️ Maestro N'A PAS de masquage de pixels : l'équivalent de `dynamicSelectors`
# du harness web n'existe pas. Deux stratégies réelles, dans cet ordre :
#   1. rendre l'app déterministe avant capture (horloge figée, données de test) ;
#   2. RECADRER la capture sur un conteneur stable — la clé ci-dessous.
# Relâcher `visualMatchPercentage` est la MAUVAISE réponse : ça masque aussi les
# vraies régressions.
#
# `visualCropOn` porte l'identifiant sémantique du conteneur sur lequel recadrer.
# Vide → plein écran. Il est injecté dans .maestro/visual.yaml, qui le pose sur
# `takeScreenshot` ET sur `assertScreenshot`.
#
# ⚠️ Le changer INVALIDE les références déjà produites : Maestro compare deux
# images qui ne cadrent plus la même chose, et l'échec ressemble à une régression
# de l'app. Le runner note le cadrage à côté des références et refuse de se taire
# s'il a bougé — régénère avec `make argus-baselines`.
#
# ⚠️ L'endroit où la racine a été posée décide de ce qu'on recadre : autour du
# `SafeArea` elle prend l'écran entier — horloge système comprise, donc un diff
# à chaque minute —, dedans la seule zone utile. Mesuré : 216 px d'écart sur un
# téléphone courant. Voir methodology-mobile.md §VISUAL.
# ⚠️ Cette clé est GLOBALE, la doctrine des racines est LOCALE : chaque écran a
# la sienne. Dès le deuxième écran en `visual: true`, aucune valeur globale ne
# convient. Pose alors `visualCropOn:` sur l'entrée de `screens[]` concernée —
# elle l'emporte sur celle-ci, qui reste le défaut :
#
#   screens:
#     - id: home
#       anchor: home_root
#       visual: true
#       visualCropOn: home_canvas   # ce cadrage-ci, pour cet écran-là
visualCropOn: ''

# ── Deep links à éprouver ──────────────────────────────────────────────────
# Consommés par .maestro/lifecycle.yaml. Le premier de la liste est joué.
# Les trouver : android/app/src/main/AndroidManifest.xml → <intent-filter>,
#               ios/Runner/Info.plist → CFBundleURLSchemes.
# ⚠️ iOS affiche au PREMIER deep link une confirmation système, et le choix est
# permanent pour ce simulateur — `clearState` ne le réinitialise pas. Le flow le
# gère, mais garde-le en tête quand un run neuf se comporte autrement.
deepLinks: []

# ── Seuils ─────────────────────────────────────────────────────────────────
thresholds:
  # Démarrage à froid / à chaud, en ms (Android : `adb shell am start -W`).
  coldStartMs: 2000
  # Combien de temps un flow attend l'écran de départ avant d'abandonner.
  #
  # ⚠️ CE N'EST PAS `coldStartMs`, et c'est pour ça que la clé existe. L'un est un
  # BUDGET — au-delà, le rapport signale une lenteur ; l'autre est un PLAFOND
  # anti-flake — au-delà, le flow renonce. Tant que le second se dérivait du
  # premier, relever le plafond parce que la suite flake relâchait du même geste
  # le gate qui rapporte la lenteur causant le flake.
  #
  # Vide (ou 0) → dérivé : `max(20 s, coldStartMs × 5)`, ce qui suit le projet
  # sans qu'on y pense. Ne le renseigne qu'après avoir MESURÉ ton démarrage :
  #   adb shell am start -W -n <package>/<activité>   # lis TotalTime
  # Relevé sur un projet réel : 6,4 s à froid, 9,3 s au tout premier lancement.
  startTimeoutMs: 0
  # Durée de splash que le PRODUIT impose — une marque qui doit rester à l'écran
  # un temps minimum. Elle est SOUSTRAITE avant de juger `coldStartMs`.
  #
  # ⚠️ Ce n'est pas un assouplissement du seuil, et c'est toute la différence :
  # une app qui s'impose 2 s de splash rend `coldStartMs: 2000` rouge par
  # construction, et relever le seuil à 4000 effacerait D'UN COUP le plancher
  # assumé et ce qui a dérivé. Ici les deux restent lisibles — le rapport écrit
  # « 6200 ms dont 2000 assumés » — et le verdict porte sur ce qui reste.
  #
  # Ne mets ici que ce que tu as MESURÉ et décidé, jamais un nombre choisi pour
  # verdir : ce serait le contraire d'un garde.
  brandedSplashMs: 0
  warmStartMs: 1000
  # Mémoire résidente de l'app, en Mo (`dumpsys meminfo` → TOTAL PSS).
  memoryMb: 250
  binarySizeMb: 60
  # Pas de `crashFreePct` ici : rien dans le harnais ne compte les crashs. Un
  # seuil que personne ne mesure se lit comme une garantie et n'en est pas.
  # ⚠️ INVERSION PAR RAPPORT AU HARNESS WEB. Côté Playwright on tolère un RATIO
  # DE DIFFÉRENCE (0.01 = 1 % de pixels divergents). Côté Maestro,
  # `thresholdPercentage` est un POURCENTAGE DE CORRESPONDANCE REQUIS, et son
  # défaut est 95. Donc « 1 % de diff toléré » s'écrit 99, pas 0.01.
  # Mettre 0.01 ici accepterait n'importe quelle image.
  visualMatchPercentage: 99

# ── Accessibilité ──────────────────────────────────────────────────────────
# ⚠️ Les échelles de texte et le ratio de contraste ne se règlent PAS ici : ils
# vivent dans `test/argus/harness.dart` (`argusTextScales`) et dans la guideline
# Flutter qui porte le 4.5. Les répéter ici donnerait deux sources de vérité,
# dont une que rien ne lit — c'est ce qu'elles étaient.
a11y:
  # Cible tactile minimale, en dp. Android : 48. iOS (HIG) : 44.
  # Lu par scripts/argus/a11y.mjs, qui mesure le rendu réel sur device.
  minTouchTargetDp: 48

# ── Localisation ───────────────────────────────────────────────────────────
# ⚠️ `--device-locale` n'existe QUE sur `maestro start-device` et `maestro cloud`,
# pas sur `maestro test` : la locale se fige au DÉMARRAGE du device. Aucun flow
# ne peut la changer.
#
# Le format monétaire attendu et le fuseau ne sont pas ici : ils ne servent qu'à
# écrire les assertions de `.maestro/i18n.yaml`, et c'est là qu'ils vivent, en
# regard du TODO qui les emploie. Une app qui n'affiche aucun montant n'a donc
# rien à renseigner.
#
# ⚠️ ET SI TU NE LAISSES PAS LE RUNNER DÉMARRER LE DEVICE (`autoStart: false`,
# la disposition que le skill recommande), CETTE CLÉ N'A AUCUN EFFET — et le
# prix n'est pas un réglage inopérant, c'est que le flow `i18n.yaml` mesure
# alors la locale de L'APPAREIL et non celle que tu déclares : il passe VERT
# quoi que tu écrives ici. Vécu : une assertion de libellé français verte sur un
# appareil en `fr_CI`, français lui aussi — elle l'aurait été quoi qu'on déclare.
# ⇒ règle la langue sur l'appareil AVANT le run, ou n'écris pas ce flow.
# Le runner le dit aussi, mais au premier `argus-run` : une fois `i18n.yaml`
# écrit, c'est-à-dire trop tard pour décider (420).
locale:
  deviceLocale: fr_FR

# ── Authentification ───────────────────────────────────────────────────────
# AUCUNE valeur en dur. Le runner lit ces variables dans l'environnement et les
# passe aux flows via `-e`. Une variable absente → le flow de login skippe et la
# dimension est rapportée non couverte.
# La forme de l'authentification (formulaire, OTP, SSO, biométrie) ne se déclare
# pas : elle s'écrit, dans `.maestro/_subflows/login.yaml`. Un champ qui la
# nomme sans que rien ne le lise laisse croire que le harnais s'y adapte.
# ⚠️ CE QUE L'AUTHENTIFICATION COÛTE À CHAQUE FLOW, et il faut le savoir avant
# d'écrire la suite. `clearState: true` avant chaque flow est la première règle
# anti-flake du harnais, et elle est juste — mais sur une application
# authentifiée elle impose une RECONNEXION PAR FLOW, donc autant d'allers-retours
# vers ton backend que tu as de flows.
#
# Relevé sur un projet réel : l'endpoint d'envoi du code à usage unique était
# borné à TROIS appels par minute, et une suite complète en consommait déjà
# trois. Les flows suivants échouaient alors sur une limite de débit — un
# symptôme qui ne ressemble à rien de ce que ce harnais décrit, et qu'on cherche
# longtemps du côté de l'instrumentation.
#
# Le levier n'est pas une clé, c'est un choix : tous les flows n'ont pas besoin
# d'être authentifiés. Ceux qui mesurent le lancement, la locale ou la
# résilience s'en passent souvent. Retire `runFlow: _subflows/login.yaml` de
# ceux-là et écris pourquoi dans le flow — ils t'appartiennent.
#
# ⚠️ Et un code à usage unique RÉEL est un effet de bord SORTANT. Contre un
# backend partagé, chaque exécution envoie un vrai message à un vrai numéro.
# `env: local` n'est pas qu'une étiquette : c'est ce qui dit que tu as le droit.
auth:
  # ⚠️ VIDE PAR DÉFAUT, ET C'EST VOULU. Ces deux clés étaient pré-remplies, si
  # bien qu'une application SANS authentification héritait de deux secrets
  # qu'elle n'a pas : le runner avertissait alors « déclarés mais VIDES » à
  # CHAQUE invocation de maestro, des dizaines de fois par run. Un
  # avertissement qu'on ne peut pas faire taire en corrigeant finit ignoré, et
  # il emmène les autres avec lui. Déclare ici ce que TON parcours consomme.
  secretsFromEnv: []
  #   - QA_USER
  #   - QA_PASS
  # Ancres consommées par .maestro/_subflows/login.yaml. Une seule vide → le
  # sous-flow skippe en entier plutôt que d'échouer à mi-parcours sur un champ
  # introuvable.
  #
  # ⚠️ CES CINQ CLÉS DÉCRIVENT UN FORMULAIRE, PAS UN PARCOURS. Sur une
  # authentification en plusieurs écrans — identifiant, puis code à usage unique,
  # puis code secret — il n'y a pas de place ici pour la décrire, et il ne doit
  # pas y en avoir : la séquence réelle s'écrit dans `login.yaml`, qui
  # t'appartient. Leur rôle se réduit alors à deux choses, et c'est suffisant :
  # ouvrir la porte (`ARGUS_AUTH_READY` exige les cinq) et dire où elle mène
  # (`success`, la seule ancre POST-connexion du harnais).
  #
  # ⚠️ « Renseigne les trois premières avec les ancres du PREMIER écran » était la
  # consigne, et elle est IMPOSSIBLE dès que chaque écran n'a qu'UN champ — le cas
  # même qu'elle prétend traiter. Ces clés nomment des RÔLES dans la séquence, pas
  # des types de champ : le premier champ qu'on remplit, le second, ce qui valide.
  # Un run a mis l'ancre du second facteur dans `password` et l'a écrit à côté :
  # c'est la bonne réponse. Écris chez toi ce que chacune désigne.
  #
  # ⚠️ Cette phrase a longtemps été fausse pour QUATRE des cinq : la condition du
  # sous-flow ne regardait que le champ identifiant. La décision se prend
  # désormais dans `run.mjs` (`authAnchorsReady`), où un garde l'exerce ancre par
  # ancre — le YAML ne fait plus que la lire.
  #
  # ⚠️ CE QU'UNE SUITE AUTHENTIFIÉE COÛTE — à lire ICI, pas trois fichiers plus
  # loin. `launch-clean.yaml` fait `clearState` avant CHAQUE flow, donc CHAQUE
  # flow se reconnecte. Deux conséquences que rien ne rappelait à cet endroit :
  #   · sur iOS, `clearState` fait RÉINSTALLER l'app par Maestro — plus lent
  #     qu'un `pm clear` Android, et c'est ce qui décide si une suite tient sous
  #     une limite de débit ;
  #   · si ton API borne l'envoi du code (typique : 3 appels par minute), une
  #     suite de six flows en consomme six. Compte AVANT de lancer.
  #
  # ⚠️ ET LE CAS QUI N'ÉTAIT PRÉVU NULLE PART : un flow qui n'inclut PAS
  # `login.yaml` mais dont les écrans sont derrière la connexion — la régression
  # visuelle, typiquement. Le conseil « retire login des flows qui n'en ont pas
  # besoin » ne le couvre pas : il en a besoin, il ne l'inclut simplement pas.
  # ⚠️ ET LA SEULE ISSUE QUI MARCHE N'ÉTAIT NOMMÉE NULLE PART. Les trois
  # ci-dessous ont été écrites sans regarder À QUI appartient chaque fichier :
  # « l'inclure » veut dire éditer `visual.yaml`, qui est du CADRE — donc écrasé
  # à la prochaine mise à jour. Un run l'a fait, puis a dû défaire.
  #   · ✅ LA BONNE : mets la connexion dans `_subflows/goto.yaml`, qui est À TOI
  #     et que `visual.yaml` appelle déjà pour chaque écran. Le cadre reste
  #     intact, la connexion se fait une fois par écran visuel, et un
  #     `_connexion-si-besoin.yaml` évite d'en payer une par capture ;
  #   · ne garder en visuel que les écrans AVANT la connexion, et dire pourquoi —
  #     c'est renoncer à la couverture visuelle de tout l'après-connexion ;
  #   · sortir ce flow de la suite et le lancer à part, hors `clearState` ;
  #   · ❌ PAS « l'inclure dans visual.yaml » : ce fichier ne t'appartient pas.
  # Les trois premières se valent selon ton coût ; la quatrième est un piège.
  #
  # ⚠️ SI TON APP N'A AUCUNE AUTHENTIFICATION, c'est un cas prévu, pas un oubli :
  # laisse les cinq vides, RETIRE les cinq TODO ci-dessous et écris à leur place
  # pourquoi (« app locale, aucun compte »). Sinon `install-mobile.sh --check`
  # compte cinq points à traiter qui n'en sont pas — et un TODO sans objet
  # apprend à ignorer les autres.
  # ⚠️ SUR UNE APP SANS COMPTE, LAISSE-LES VIDES — et sache ce que ça fait.
  # Tout `journey-critical.yaml` est gardé par `ARGUS_ANCHOR_AFTER_AUTH`, si
  # bien qu'à la lecture on croit que le parcours entier va se sauter. Il ne se
  # saute pas : le runner fait retomber cette variable sur l'ancre d'accueil
  # quand aucune ancre d'auth n'est déclarée. Le comportement est bon ; c'est de
  # ne le lire NULLE PART qui coûte — il ne se découvrait qu'en ouvrant run.mjs.
  anchors:
    screen: ''     # TODO(argus): ancre de l'écran de connexion
    user: ''       # TODO(argus): champ identifiant
    password: ''   # TODO(argus): champ mot de passe
    submit: ''     # TODO(argus): bouton de validation
    success: ''    # TODO(argus): ancre prouvant que la session est ouverte
    #                ⚠️ Ces cinq clés nomment des RÔLES, pas des types de champ —
    #                lis l'encadré au-dessus de `auth:` avant de les remplir.


# ── Sécurité (MASVS statique — détection, jamais exploitation) ─────────────
# ⚠️ Uniquement sur TES propres builds. Jamais de reverse-engineering d'une app
# tierce : c'est la frontière, elle n'est pas négociable.
security:
  # ── Les findings de sécurité que tu ASSUMES ────────────────────────────────
  # ⚠️ CE N'EST PAS UNE LISTE D'EXCEPTIONS, C'EST UN RELEVÉ — même contrat que
  # `test/argus/known_issues.dart`. Une ligne ici affirme que le finding EST
  # ENCORE LÀ et que tu l'assumes ; le jour où il disparaît, le scan le dit
  # (« acquittement PÉRIMÉ ») et tu la retires. Sans cette expiration, la liste
  # survivrait à ce qu'elle décrit et deviendrait une permission permanente.
  #
  # ⚠️ POURQUOI CETTE CLÉ EXISTE. `sec.mjs` et `sca.mjs` codaient `status:
  # 'open'` en dur : un finding jugé inerte pour le binaire analysé — un
  # `usesCleartextTraffic` qui ne vit que dans le manifeste de DEBUG, vérifié
  # absent du release — n'avait nulle part où être acté, et réapparaissait à
  # chaque run. Un signal qu'on ne peut pas faire taire en ayant raison finit
  # ignoré, et il emmène ses voisins.
  #
  # Un acquittement ne SUPPRIME rien : le finding reste compté et affiché, avec
  # sa raison, il cesse seulement de faire échouer le gate. Et la raison est
  # OBLIGATOIRE — sans elle l'acquittement ne compte pas, parce qu'un motif vide
  # se relit dans six mois comme un oubli que personne n'ose retirer.
  acknowledged: []
  #   - id: QAM-SEC-CLEAR
  #     why: vit dans src/debug/AndroidManifest.xml, jamais fusionné en release
  # ⚠️ La raison tient sur UNE ligne — ce parseur n'accepte ni bloc `|`/`>` ni
  # chaîne repliée, et l'exemple ci-dessus était lui-même replié : décommenté
  # tel quel, il faisait échouer TOUTES les commandes (459). Raccourcis plutôt
  # que de replier : cette phrase est faite pour être relue dans six mois.

  # Permissions attendues. Toute permission présente hors de cette liste est un
  # finding (permission excessive).
  #
  # ⚠️ CETTE LISTE SE DÉRIVE DU MANIFESTE FUSIONNÉ, PAS DU TIEN. Le manifeste du
  # dépôt ne porte que ce que tu as écrit ; celui de l'APK porte en plus tout ce
  # que les dépendances y ont injecté — et c'est celui-là que les stores lisent.
  # La remplir depuis `android/app/src/main/AndroidManifest.xml` produit donc une
  # liste incomplète, et un lot de « permissions non prévues » qui sont en réalité
  # normales.
  #
  # L'ordre est : construire l'APK, LIRE le manifeste fusionné, puis remplir.
  #     make argus-build
  #     aapt2 dump permissions build/app/outputs/flutter-apk/app-debug.apk
  #
  # ⚠️ Sans `aapt2` au PATH, `make argus-sec` ne peut pas lire ce manifeste : il
  # le dit et SAUTE ce contrôle, il ne le passe pas en vert. Poser cette liste
  # avant d'avoir aapt2 revient à régler quelque chose qu'on ne peut pas encore
  # mesurer.
  # ⚠️ DÉRIVE CETTE LISTE DU MANIFESTE FUSIONNÉ DE LA RELEASE, pas du debug.
  # Les deux diffèrent : un build debug embarque des permissions que la
  # publication n'a pas (et l'inverse arrive avec les règles de shrinking).
  # Remplie depuis un debug, cette liste déclare « attendu » ce que
  # l'utilisateur ne recevra jamais — et tait ce qu'il recevra.
  #   aapt2 dump permissions build/app/outputs/flutter-apk/app-release.apk
  # 531 — Les invites système peuvent-elles naître pendant un run ?
  #   auto   : dérivé des permissions ci-dessous (Android) · toujours joué sur
  #            iOS, où le plugin n'a AUCUNE source à dériver
  #   always : joué quoi qu'il arrive
  #   never  : jamais joué
  # ⚠️ `never` est une DÉCLARATION, pas une optimisation : ne l'écris que si ton
  # application ne demande AUCUNE permission système. Le geste coûte ~7 s par
  # flow et, sur iOS, il ABSORBE la mesure de démarrage — mesuré au run 93 :
  # 7 flows sur 8 rendaient 83 à 95 ms derrière 7 110 à 7 160 ms d'attente, donc
  # un budget qu'aucune valeur ne pouvait dépasser. Mais le déclarer à tort rend
  # les flows ROUGES sur une ancre parfaitement correcte, l'invite recouvrant
  # l'écran attendu — mesuré au run 90 : 5 flows et 159 s de device.
  systemAlerts: auto

  expectedPermissions:
    - android.permission.INTERNET
  # Permissions qui font échouer immédiatement si présentes.
  forbiddenPermissions:
    - android.permission.READ_SMS
    - android.permission.RECEIVE_SMS
    - android.permission.READ_CONTACTS
  # ⚠️ `ACCESS_FINE_LOCATION` N'EST PLUS INTERDITE PAR DÉFAUT, et c'est une
  # décision. Les trois ci-dessus sont d'une autre nature : leur présence est
  # presque toujours un signal. La localisation, non — livraison, transport,
  # cartographie, intervention sur le terrain : le serveur y refuse souvent
  # l'opération sans elle. La laisser interdite produisait un `critical`
  # permanent sur une exigence légitime, que deux projets réels ont dû désarmer
  # sans que rien leur dise que c'était prévu.
  # Ajoute-la ci-dessus si TON application n'a aucune raison de localiser :
  #   - android.permission.ACCESS_FINE_LOCATION
  # Drapeaux du manifeste Android exigés en release.
  requireDebuggableOff: true
  requireCleartextDisabled: true
  requireAllowBackupOff: true
  # Exiger `--obfuscate --split-debug-info` sur les builds release.
  #
  # ⚠️ Le contrôle cherche les chemins `package:<name du pubspec>/….dart` dans
  # libapp.so, et RIEN D'AUTRE. Les chemins du framework (`package:flutter/…`)
  # survivent à `--obfuscate` : les compter rendait le même verdict sur un
  # binaire obfusqué et sur un binaire qui ne l'est pas. Ils servent désormais de
  # contre-épreuve — leur absence dit que la lecture a échoué, et la dimension
  # se marque « non jugée » plutôt que verte.
  requireObfuscation: true
  # Motifs de secrets cherchés dans le binaire ET dans les sources.
  # Repris du harness web (argus.config.ts) + spécifiques mobile.
  secretPatterns:
    - 'AKIA[0-9A-Z]{16}'                                          # AWS access key id
    - 'sk_live_[0-9a-zA-Z]{16,}'                                  # Stripe live secret
    - 'AIza[0-9A-Za-z\-_]{35}'                                    # Google API key
    - 'ghp_[0-9A-Za-z]{36}'                                       # GitHub PAT
    - 'xox[baprs]-[0-9A-Za-z-]{10,}'                              # Slack token
    - '-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'    # clé privée
    - 'ya29\.[0-9A-Za-z\-_]+'                                     # jeton OAuth Google
    - 'eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.'            # JWT signé en dur
    - 'sk-[A-Za-z0-9]{32,}'                                       # clé de type OpenAI
    # ⚠️ ANCRÉS EN DÉBUT DE LIGNE, et le `=` est optionnel. Mesuré sur six cas :
    #   `…=\s*\S+`     → 3 faux positifs (une LECTURE `= props.getProperty("…")`,
    #                      une lecture d'environnement, et un commentaire qui parle
    #                      du motif) et 1 faux négatif (la forme Groovy sans `=`).
    #   `…=\s*[quote]` → 1 faux positif (le commentaire) et 1 faux négatif.
    #   celui-ci       → 0 et 0.
    # Le drapeau `(?m)` est lu par `compilePattern`, et aucun autre motif livré
    # n'emploie `^` ni `$` : il n'a donc aucun effet de bord.
    - '(?m)^\s*[sS]tore[pP]assword\s*=?\s*["'']'                    # keystore Android
    - '(?m)^\s*[kK]ey[pP]assword\s*=?\s*["'']'
  # Fichiers où un motif ci-dessus est ATTENDU et légitime : la clé `AIza` de
  # google-services.json est une clé client publique, pas une fuite. Sans cette
  # liste, chaque run remonterait le même faux positif — et un rapport qui crie
  # au loup à chaque fois finit par ne plus être lu.
  #
  # ⚠️ N'y liste QUE des fichiers VERSIONNÉS. Le scan ne parcourt que ce que git
  # suit : un fichier gitignoré (`android/key.properties`, `.env`) n'est déjà pas
  # regardé, donc l'inscrire ne dispense rien — mais ressemble à une décision de
  # sécurité, et plus personne ne la remet en cause. `make argus-sec` signale
  # désormais les entrées qui ne dispensent aucun fichier scanné.
  #
  # ⚠️ CETTE LISTE EST VIDE PAR DÉFAUT, ET C'EST VOULU. Elle a livré pendant un
  # temps les deux fichiers Firebase ci-dessous, qui n'existent pas sur un projet
  # qui n'utilise pas Firebase — le scan signalait donc deux entrées inertes dès
  # la première exécution, c'est-à-dire que le harnais criait au loup pour sa
  # propre valeur par défaut, ce qu'il reproche justement aux rapports.
  #
  # Ajoute une ligne quand un run remonte un faux positif, pas avant. Si tu
  # utilises Firebase, les deux entrées à écrire sont :
  #     - android/app/google-services.json
  #     - ios/Runner/GoogleService-Info.plist
  # ⚠️ …seulement s'ils sont VERSIONNÉS (voir plus haut) : sur un projet qui
  # utilise pourtant Firebase, ces deux entrées se sont révélées INERTES, les
  # fichiers étant gitignorés. `git check-ignore -q <fichier>` tranche.
  allowSecretsIn: []
  # Sévérité SCA (osv-scanner) qui fait échouer.
  scaFailOn: high

# ── Budget d'exécution ─────────────────────────────────────────────────────
# Le runner mesure ce que le run a coûté et le compare à ces deux plafonds : il
# AVERTIT au dépassement et publie le relevé dans `run.budget` du rapport. Il ne
# tronque rien et ne fait pas échouer — dépasser un budget dit quelque chose de
# la capacité, pas de l'application, et faire rougir la CI là-dessus apprendrait
# à ignorer le rouge. Mettre 0 désactive le plafond.
telemetry:
  # ── Les canaux sortants que tu n'as PAS pu couper ──────────────────────────
  # 🔴 POURQUOI CETTE CLÉ EXISTE. Une passe QA neutralise sa télémétrie par des
  # injections de build (`--dart-define=SENTRY_DSN=`…). Deux runs en aveugle, sur
  # deux projets et deux SDK différents, ont buté le même jour sur la même
  # limite : une vérification de version du magasin d'un côté, la messagerie push
  # de l'autre. Aucun drapeau ne les gouverne, et les couper aurait demandé de
  # modifier `lib/` — donc de changer l'application qu'on vient mesurer.
  #
  # Les deux agents l'ont écrit dans leur compte rendu. Un compte rendu se lit
  # une fois ; une passe QA se relit pendant des mois. D'où cet endroit-ci, dans
  # le livrable : le rapport publie la liste sous « Canaux laissés ouverts ».
  #
  # Ça n'excuse rien et ça ne fait échouer aucun gate : ça rend VISIBLE. Le taire
  # ferait croire qu'une passe QA est muette alors qu'elle émet.
  #
  # ⚠️ `why` est une ÉNUMÉRATION, pas une phrase, et c'est délibéré : une clé qui
  # invite à écrire une phrase, dans un parseur qui n'accepte qu'une ligne, est
  # l'écart de conception que le 504 a payé quatre fois. Trois valeurs :
  #     no-build-flag      aucune injection de build ne le gouverne
  #     would-change-app   le couper demanderait de modifier `lib/`
  #     sdk-autostart      le SDK démarre de lui-même, avant tout code du projet
  leftOpen: []
  #   - channel: store-version-check
  #     to: apple-app-store
  #     why: no-build-flag

budget:
  maxMinutes: 25
  maxFlows: 40

# ── Gating CI ──────────────────────────────────────────────────────────────
# Sévérités et exit codes IDENTIQUES au skill web : 0 vert · 1 major · 2 blocker
# ou critical. Voir references/methodology-mobile.md §8.
gate:
  failOn: [blocker, critical, major]
  # Pas de `failOnNewFinding` : le harnais ne conserve aucun run précédent, donc
  # rien ne saurait dire lequel est « nouveau ». Le promettre aurait laissé
  # croire à un gating différentiel qui n'existe pas.
  failOnVisualDiff: true
  # Une suite où AUCUN flow n'a réellement tourné (toutes les ancres vides) sort
  # en exit 2. Sans cette règle, un scaffold neuf rendrait un vert parfait en
  # ne testant rien — le pire résultat possible pour une garde de non-régression.
  failOnEmptyRun: true

# ── Artefacts ──────────────────────────────────────────────────────────────
artifacts:
  dir: argus-mobile-report
  # Baselines de régression visuelle. ⚠️ Elles sont liées au COUPLE device+OS :
  # une baseline générée sur ton simulateur ne correspondra jamais au rendu de
  # l'émulateur de la CI. Génère-les sur la même image que la CI (même piège que
  # les snapshots Playwright du skill web).
  baselines: .maestro/_baselines

# ── Publication du rapport ─────────────────────────────────────────────────
# Le rapport HTML peut être publié comme page consultable, en plus des fichiers
# du dossier ci-dessus. C'est l'agent qui publie : les scripts n'en ont pas le
# moyen, et une CI n'a pas d'agent — un job produira donc toujours le fichier,
# jamais l'URL.
#
# ⚠️ Publier ENVOIE le rapport à un service tiers. La page est privée par
# défaut, ce qui veut dire « pas partagée avec d'autres », pas « restée sur ta
# machine » : le contenu est bien hébergé ailleurs, et une page privée se
# partage d'un clic. Sur une application sous contrat, vérifie que c'est permis
# AVANT d'activer — d'où le défaut ci-dessous.
# ── Fichiers de configuration : présents ≠ EMBARQUÉS ────────────────────────
# Un fichier posé dans les sources que RIEN ne câble n'arrive jamais dans le
# binaire — et ça ne se voit qu'au lancement, quand l'app affiche son écran
# d'erreur et que TOUS les flows rougissent en accusant l'instrumentation.
# Vécu : un `GoogleService-Info.plist` absent du projet Xcode, six flows rouges,
# ~36 min d'appareil pour un défaut détectable en millisecondes et sans device.
#
# Trois familles sont contrôlées d'office (Firebase iOS, Firebase Android,
# polices). Déclare ICI celles qui sont propres à ton projet — le mécanisme est
# le même, seule change la déclaration qui fait l'embarquement :
#
#   configFiles:
#     - id: mon-service
#       quoi: config/service.json           # un chemin exact, ou l'une des formes ci-dessous
#       cable: pubspec.yaml                 # le fichier où le câblage se déclare
#       casse: le service ne démarre pas    # ce qui arrive si personne ne le câble
#       motif: mon_plugin                   # FACULTATIF — voir juste en dessous
#
# `quoi:` accepte trois formes, parce qu'un fichier ne se range pas toujours au
# même endroit :
#     quoi: config/service.json     ← un chemin exact
#
#     quoi:                         ← une FAMILLE d'extensions sous un dossier
#       sous: assets
#       extensions: ['.json']
#
#     quoi:                         ← un NOM, rangé où que ce soit sous un dossier
#       sous: android/app
#       nom: service.json
#
#   ⚠️ En map IMBRIQUÉE, une clé par ligne — jamais `{ sous: …, nom: … }` : ce
#   parseur refuse les maps en flow, et un exemple se recopie (256).
#   La troisième existe pour les fichiers qu'un source set de flavor déplace :
#   `android/app/src/dev/google-services.json` est la disposition standard dès
#   qu'un projet a plusieurs environnements, et un chemin littéral l'aurait raté.
#
# 🔴 `motif:` EST LA CLÉ DU CAS « CÂBLÉ PAR CONVENTION » (464). Par défaut, le
# contrôle cherche le NOM du fichier dans la déclaration — ce qui est juste
# quand quelque chose le nomme (une police dans `pubspec.yaml`, un asset). Mais
# beaucoup de fichiers ne sont **jamais nommés** : c'est un plugin qui les
# trouve par convention, et c'est donc le PLUGIN qu'il faut chercher.
#   `google-services.json` en est l'exemple livré : rien ne le nomme dans
#   `build.gradle`, si bien qu'un contrôle par nom l'aurait déclaré orphelin sur
#   tout projet correct. Sa règle porte `motif: 'google-services'`, le nom du
#   plugin Gradle qui le lit.
#   ⚠️ Sans cette clé, le seul contrôle possible est « le fichier est-il nommé ? »
#   — et pour un fichier câblé par convention, la réponse est NON même quand tout
#   va bien. Le contrôle rendrait alors un `major` que personne ne peut corriger.
#
# ⚠️ C'est la PRÉSENCE du fichier qui déclenche, jamais une supposition sur ce
# que le projet utilise : s'il est là, quelqu'un l'a mis là exprès.
configFiles: []

artifact:
  enabled: false
  # Renseignée à la première publication, puis réutilisée : sans elle, chaque
  # run créerait une page de plus au lieu de mettre la sienne à jour.
  #
  # ⚠️ UNE PAGE PAR PLATEFORME. Un rapport décrit UN run, donc une plateforme ;
  # republier un run iOS sur l'URL du rapport Android ne les réunit pas, il
  # REMPLACE l'un par l'autre — et le premier n'existe plus nulle part. Vécu.
  # Deux formes se lisent, l'ancienne continue de marcher :
  #     url: 'https://…'                                  ← mono-plateforme
  #     url:
  #       ios: 'https://…'
  #       android: 'https://…'
  # `title:` accepte les deux formes de la même façon.
  url: ''
  # La page garde ses runs passés en onglets — jusqu'à 30, mesures seulement,
  # sans les captures (elles pèsent ~625 Ko par run, la page est plafonnée à
  # 16 Mo). L'historique vit DANS la page publiée : `argus-mobile-report/` est
  # ignoré par git et effacé entre deux runs, rien d'autre ne survit. D'où :
  #     make argus-report ARGS="--previous=<la page publiée, enregistrée>"
  # Sans `--previous`, republier ÉCRASE les onglets ; le rapport t'avertit.
  # TODO(argus): le nom de la page. Vide = « Rapport Argus Mobile ». Le garder
  # STABLE : c'est ainsi qu'on la retrouve parmi les autres.
  title: ''
  # TODO(argus): l'emoji de l'onglet. Vide = 👁. ⚠️ IL VIT ICI ET PAS DANS TA
  # TÊTE : le skill exige qu'il reste stable d'un run à l'autre, et sans clé pour
  # le porter, celui qui republiera en choisira un autre — la page changera
  # d'identité et se lira comme une seconde page. Mesuré : un agent a pris 📱🔍
  # et l'a écrit dans son compte rendu, nulle part ailleurs.
  icon: ''
  # Captures des findings embarquées dans la page : all | major | none.
  # « none » laisse les chemins, comme dans le rapport local : rien de l'app ne
  # part, mais la page ne se suffit plus à elle-même.
  # ⚠️ « all » NE VEUT PAS DIRE « toutes les captures du run ». Les preuves sont
  # celles des FINDINGS : un run sans finding publie donc une page **sans aucune
  # capture** — 11 Ko mesurés sur un run vert. C'est voulu (une preuve illustre
  # un défaut), mais le mot induit en erreur, et l'acquittement ci-dessous se
  # demande alors pour des images qui ne partiront jamais.
  evidence: all
  # ⚠️ CE QUI FERME L'AVERTISSEMENT SUR LES CAPTURES. Tant qu'elle est vide,
  # `config.mjs` rappelle à CHAQUE exécution que les captures d'écran partiront
  # avec le rapport publié — une dizaine de fois par run. C'est voulu tant que
  # personne n'a tranché, et insupportable une fois que si : un avertissement
  # qu'on ne peut pas acquitter finit ignoré, et il emmène les autres avec lui.
  # Écris la RAISON, pas un booléen — « app interne, aucune donnée client » se
  # relit dans six mois, `true` ne se relit pas. ⚠️ SUR UNE SEULE LIGNE : ce
  # parseur n'accepte ni bloc `|`/`>` ni chaîne repliée, et une invitation à
  # « écrire une phrase » y a déjà conduit deux fois. Il refuse en nommant la
  # ligne, donc rien ne casse en silence — mais toutes les commandes s'arrêtent
  # tant que ce n'est pas corrigé. Si ta raison ne tient pas sur une ligne,
  # raccourcis-la : elle est faite pour être relue (393). Et si les captures ne doivent
  # PAS partir, c'est `evidence: none` qu'il faut, pas un acquittement.
  evidenceAcknowledged: ''
  # Plafond de la page. Ce qui ne rentre pas est ANNONCÉ dans le rapport, jamais
  # retiré en silence — une preuve absente sans un mot se lit « pas de preuve ».
  maxMb: 12
