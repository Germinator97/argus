# ═══════════════════════════════════════════════════════════════════════════
# argus.mobile.yaml — réglages du harness QA mobile, spécifiques à l'application.
# ARGUS:OWNED — à toi : l'installeur ne l'écrase ni ne le compare, jamais.
#
# C'est la SOURCE UNIQUE DE LA CONFIGURATION : tous les scripts
# (`scripts/argus/*.mjs`) et tous les flows Maestro lisent depuis ici.
#
# Ce n'est pas pour autant le seul fichier à éditer, et le prétendre fait
# chercher ailleurs ce qu'on ne trouve pas. Les autres portent du CODE et des
# PARCOURS, qui n'ont pas leur place dans du YAML :
#   test/argus/harness.dart       les écrans à monter, les polices, le thème
#   test/argus/known_issues.dart  la dette que les gardes révèlent
#   .maestro/*.yaml marqués OWNED les parcours métier
# `install-mobile.sh` te les liste en sortant, avec les `TODO(argus)` restants.
#
# Les valeurs sensibles n'ont RIEN à faire dans ce fichier. Les identifiants de
# test viennent de l'environnement (voir `auth.secretsFromEnv`) et sont injectés
# aux flows par le runner via `maestro test -e KEY=…`.
#
# SOUS-ENSEMBLE YAML ACCEPTÉ (scripts/argus/config.mjs, sans dépendance) :
#   commentaires · maps imbriquées · listes (bloc `- x` et flow `[a, b]`)
#   chaînes nues ou quotées · entiers · flottants · true/false · null/~
# NON accepté, et signalé par une erreur explicite plutôt que mal interprété :
#   ancres/alias (&, *) · blocs multi-lignes (|, >) · maps en flow ({a: 1})
#   `yes`/`no`/`on`/`off` nus (ambigus en YAML 1.1 — écris true/false)
# ═══════════════════════════════════════════════════════════════════════════

# ── L'application sous test ────────────────────────────────────────────────
app:
  # Nom du paquet Dart (pubspec.yaml → name). Sert d'étiquette dans les rapports.
  name: mon_app
  # Identifiant Android (applicationId) et iOS (CFBundleIdentifier). C'est ce que
  # Maestro met dans `appId:` en tête de chaque flow. REQUIS pour la plateforme
  # que tu testes ; laisse vide celle que tu ne testes pas.
  # Retrouve-les : android/app/build.gradle(.kts) → applicationId
  #                ios/Runner.xcodeproj → PRODUCT_BUNDLE_IDENTIFIER
  androidPackage: ''   # TODO(argus): ex. com.exemple.monapp
  iosBundleId: ''      # TODO(argus): ex. com.exemple.monapp
  # Flavor / scheme testé. Vide si le projet n'en a pas.
  flavor: ''

# ── Le binaire à installer ─────────────────────────────────────────────────
# Maestro N'INSTALLE PAS l'application : il pilote un binaire déjà présent sur
# le device. C'est le runner qui installe (adb install -r / xcrun simctl install)
# et qui VÉRIFIE que l'installation a réussi — `adb install` peut échouer en
# silence et laisser tourner la version précédente.
build:
  android: build/app/outputs/flutter-apk/app-debug.apk
  # ⚠️ CE QU'ON INSTALLE ≠ CE QU'ON ANALYSE. La clé ci-dessus décide de ce que le
  # runner POSE sur l'appareil — un debug, presque toujours. Le scan de sécurité,
  # lui, ne conclut que sur la PUBLICATION : sur un debug il se saute, avec sa
  # raison. Renseigne alors le binaire de release ici, une fois pour toutes,
  # plutôt que d'éditer la ligne du dessus entre deux runs :
  # androidScan: build/app/outputs/flutter-apk/app-release.apk
  # (ponctuellement : `node scripts/argus/sec.mjs --binary=<chemin>`)
  ios: build/ios/iphonesimulator/Runner.app
  # Commandes de build proposées quand le binaire est absent. Jamais lancées
  # ⚠️ Elles ne sont JAMAIS lancées par le harnais — ni avec, ni sans
  # confirmation : aucun script ne les exécute, ils les AFFICHENT. La
  # formulation d'avant laissait croire à une garde qui n'a pas lieu d'être,
  # et donc à une exécution qui n'a jamais lieu non plus.
  androidBuildCmd: flutter build apk --debug
  iosBuildCmd: flutter build ios --debug --simulator

# ── Plateformes activées ───────────────────────────────────────────────────
# Retire `ios` si tu n'as pas de Mac / Xcode. Une plateforme désactivée est
# rapportée `skipped`, jamais verte.
platforms:
  - android

# ── Matrice de devices ─────────────────────────────────────────────────────
# Comment la choisir sous budget : references/device-matrix.md.
#
# ⚠️ NE CIBLE PAS UN ÉMULATEUR ANDROID PAR SON udid. « emulator-5554 » est un
# NUMÉRO DE PORT, attribué dans l'ordre de démarrage : le même udid désigne un
# autre AVD dès que les émulateurs ont démarré dans un ordre différent. Ça se
# voit d'autant moins que le run se déroule normalement — sur l'app d'à côté.
# Utilise `avd`, qui est stable (liste : emulator -list-avds).
#
# `avd`        → nom d'AVD Android, la seule identité stable. Prioritaire.
# `udid`       → iOS (UUID stable) et téléphones physiques (avec physical: true).
# les deux vides → le runner prend le premier ÉMULATEUR, jamais un physique.
# `autoStart`  → démarre le device s'il n'est pas déjà là
#                (maestro start-device --device-model … --device-os …).
#                ⚠️ Incompatible avec `avd` : start-device CRÉE son propre AVD,
#                il ne sait pas démarrer le tien. Lance-le toi-même.
# `model`/`os` → consommés par autoStart uniquement. Ce sont des noms MAESTRO
#                (`pixel_6`), pas ce que l'appareil rend (`sdk_gphone64_arm64`) :
#                le rapport, lui, écrit ce qu'il a MESURÉ sur le device.
#                ⚠️ Avec `autoStart: false` ils ne servent à RIEN, et le rapport
#                les rend alors `null` plutôt que de les afficher en « déclaré »
#                face au modèle mesuré — une comparaison entre deux choses qui
#                ne parlent pas de la même, et qui se lit comme un écart.
# `role: primary` → device qui porte les baselines visuelles et les mesures perf.
devices:
  - id: android-emu
    platform: android
    avd: ''
    udid: ''
    model: pixel_6
    os: android-33
    autoStart: true
    role: primary
  # - id: ios-sim
  #   platform: ios
  #   udid: ''
  #   model: iPhone-16
  #   os: iOS-18-2
  #   autoStart: true
  #   role: secondary

# ── Écrans clés ────────────────────────────────────────────────────────────
# `anchor` = l'identifiant sémantique qui PROUVE que l'écran est affiché, posé
# côté Dart par `Semantics(identifier: 'home_root')` (Flutter ≥ 3.19).
# ⚠️ Les `Key` Flutter ne sont PAS exposées à la couche d'accessibilité : un flow
# qui cible une Key échoue. C'est le piège n°1 — voir methodology-mobile.md §6.
#
# Un écran dont `anchor` est vide est IGNORÉ par les flows (skip propre), et
# compté dans `coverage.notConfigured` du rapport. Il n'est jamais vert.
#
# `start: true` désigne l'écran d'où partent TOUS les flows, après `clearState`.
# Un seul écran peut le porter, et il lui faut une ancre — les deux sont vérifiés
# par `make argus-doctor`, sans device.
#
# ⚠️ Renseigne-le dès que tu déclares plusieurs ÉTATS d'un même écran. Sans lui,
# le runner prend l'écran d'`id: home`, et à défaut le PREMIER de la liste : si
# c'est l'état « liste pleine », son ancre n'existe pas au lancement et tous les
# flows partent de travers — par intermittence, donc en accusant autre chose. Le
# repli reste en place pour ne casser aucune config, mais il s'annonce dans la
# sortie du runner et dans `startup.origin` du rapport.
screens:
  - id: home
    anchor: ''         # TODO(argus): Semantics(identifier: '…') de l'écran d'accueil
    priority: p0
    visual: true
  - id: login
    anchor: ''         # TODO(argus): l'ancre de racine de cet écran
    priority: p0
    visual: true
  # - id: profile
  #   anchor: profile_root
  #   priority: p1
  #   visual: true

# ── Zones non déterministes ────────────────────────────────────────────────
# ⚠️ Maestro N'A PAS de masquage de pixels : l'équivalent de `dynamicSelectors`
# du harness web n'existe pas. Deux stratégies réelles, dans cet ordre :
#   1. rendre l'app déterministe avant capture (horloge figée, données de test) ;
#   2. RECADRER la capture sur un conteneur stable — la clé ci-dessous.
# Relâcher `visualMatchPercentage` est la MAUVAISE réponse : ça masque aussi les
# vraies régressions.
#
# `visualCropOn` porte l'identifiant sémantique du conteneur sur lequel recadrer.
# Vide → plein écran. Il est injecté dans .maestro/visual.yaml, qui le pose sur
# `takeScreenshot` ET sur `assertScreenshot`.
#
# ⚠️ Le changer INVALIDE les références déjà produites : Maestro compare deux
# images qui ne cadrent plus la même chose, et l'échec ressemble à une régression
# de l'app. Le runner note le cadrage à côté des références et refuse de se taire
# s'il a bougé — régénère avec `make argus-baselines`.
#
# ⚠️ L'endroit où la racine a été posée décide de ce qu'on recadre : autour du
# `SafeArea` elle prend l'écran entier — horloge système comprise, donc un diff
# à chaque minute —, dedans la seule zone utile. Mesuré : 216 px d'écart sur un
# téléphone courant. Voir methodology-mobile.md §VISUAL.
# ⚠️ Cette clé est GLOBALE, la doctrine des racines est LOCALE : chaque écran a
# la sienne. Dès le deuxième écran en `visual: true`, aucune valeur globale ne
# convient. Pose alors `visualCropOn:` sur l'entrée de `screens[]` concernée —
# elle l'emporte sur celle-ci, qui reste le défaut :
#
#   screens:
#     - id: home
#       anchor: home_root
#       visual: true
#       visualCropOn: home_canvas   # ce cadrage-ci, pour cet écran-là
visualCropOn: ''

# ── Deep links à éprouver ──────────────────────────────────────────────────
# Consommés par .maestro/lifecycle.yaml. Le premier de la liste est joué.
# Les trouver : android/app/src/main/AndroidManifest.xml → <intent-filter>,
#               ios/Runner/Info.plist → CFBundleURLSchemes.
# ⚠️ iOS affiche au PREMIER deep link une confirmation système, et le choix est
# permanent pour ce simulateur — `clearState` ne le réinitialise pas. Le flow le
# gère, mais garde-le en tête quand un run neuf se comporte autrement.
deepLinks: []

# ── Seuils ─────────────────────────────────────────────────────────────────
thresholds:
  # Démarrage à froid / à chaud, en ms (Android : `adb shell am start -W`).
  coldStartMs: 2000
  # Durée de splash que le PRODUIT impose — une marque qui doit rester à l'écran
  # un temps minimum. Elle est SOUSTRAITE avant de juger `coldStartMs`.
  #
  # ⚠️ Ce n'est pas un assouplissement du seuil, et c'est toute la différence :
  # une app qui s'impose 2 s de splash rend `coldStartMs: 2000` rouge par
  # construction, et relever le seuil à 4000 effacerait D'UN COUP le plancher
  # assumé et ce qui a dérivé. Ici les deux restent lisibles — le rapport écrit
  # « 6200 ms dont 2000 assumés » — et le verdict porte sur ce qui reste.
  #
  # Ne mets ici que ce que tu as MESURÉ et décidé, jamais un nombre choisi pour
  # verdir : ce serait le contraire d'un garde.
  brandedSplashMs: 0
  warmStartMs: 1000
  # % de frames au-delà du budget de 16 ms (`dumpsys gfxinfo … framestats`).
  jankFramesPct: 1
  memoryMb: 250
  binarySizeMb: 60
  # Pas de `crashFreePct` ici : rien dans le harnais ne compte les crashs. Un
  # seuil que personne ne mesure se lit comme une garantie et n'en est pas.
  # ⚠️ INVERSION PAR RAPPORT AU HARNESS WEB. Côté Playwright on tolère un RATIO
  # DE DIFFÉRENCE (0.01 = 1 % de pixels divergents). Côté Maestro,
  # `thresholdPercentage` est un POURCENTAGE DE CORRESPONDANCE REQUIS, et son
  # défaut est 95. Donc « 1 % de diff toléré » s'écrit 99, pas 0.01.
  # Mettre 0.01 ici accepterait n'importe quelle image.
  visualMatchPercentage: 99

# ── Accessibilité ──────────────────────────────────────────────────────────
# ⚠️ Les échelles de texte et le ratio de contraste ne se règlent PAS ici : ils
# vivent dans `test/argus/harness.dart` (`argusTextScales`) et dans la guideline
# Flutter qui porte le 4.5. Les répéter ici donnerait deux sources de vérité,
# dont une que rien ne lit — c'est ce qu'elles étaient.
a11y:
  # Cible tactile minimale, en dp. Android : 48. iOS (HIG) : 44.
  # Lu par scripts/argus/a11y.mjs, qui mesure le rendu réel sur device.
  minTouchTargetDp: 48

# ── Localisation ───────────────────────────────────────────────────────────
# ⚠️ `--device-locale` n'existe QUE sur `maestro start-device` et `maestro cloud`,
# pas sur `maestro test` : la locale se fige au DÉMARRAGE du device. Aucun flow
# ne peut la changer.
#
# Le format monétaire attendu et le fuseau ne sont pas ici : ils ne servent qu'à
# écrire les assertions de `.maestro/i18n.yaml`, et c'est là qu'ils vivent, en
# regard du TODO qui les emploie. Une app qui n'affiche aucun montant n'a donc
# rien à renseigner.
locale:
  deviceLocale: fr_FR

# ── Authentification ───────────────────────────────────────────────────────
# AUCUNE valeur en dur. Le runner lit ces variables dans l'environnement et les
# passe aux flows via `-e`. Une variable absente → le flow de login skippe et la
# dimension est rapportée non couverte.
# La forme de l'authentification (formulaire, OTP, SSO, biométrie) ne se déclare
# pas : elle s'écrit, dans `.maestro/_subflows/login.yaml`. Un champ qui la
# nomme sans que rien ne le lise laisse croire que le harnais s'y adapte.
auth:
  secretsFromEnv:
    - QA_USER
    - QA_PASS
  # Ancres sémantiques du formulaire de connexion, consommées par
  # .maestro/_subflows/login.yaml. Une seule vide → le sous-flow skippe en entier
  # plutôt que d'échouer à mi-parcours sur un champ introuvable.
  anchors:
    screen: ''     # TODO(argus): ancre de l'écran de connexion
    user: ''       # TODO(argus): champ identifiant
    password: ''   # TODO(argus): champ mot de passe
    submit: ''     # TODO(argus): bouton de validation
    success: ''    # TODO(argus): ancre prouvant que la session est ouverte

# ── Sécurité (MASVS statique — détection, jamais exploitation) ─────────────
# ⚠️ Uniquement sur TES propres builds. Jamais de reverse-engineering d'une app
# tierce : c'est la frontière, elle n'est pas négociable.
security:
  # Permissions attendues. Toute permission présente hors de cette liste est un
  # finding (permission excessive).
  #
  # ⚠️ CETTE LISTE SE DÉRIVE DU MANIFESTE FUSIONNÉ, PAS DU TIEN. Le manifeste du
  # dépôt ne porte que ce que tu as écrit ; celui de l'APK porte en plus tout ce
  # que les dépendances y ont injecté — et c'est celui-là que les stores lisent.
  # La remplir depuis `android/app/src/main/AndroidManifest.xml` produit donc une
  # liste incomplète, et un lot de « permissions non prévues » qui sont en réalité
  # normales.
  #
  # L'ordre est : construire l'APK, LIRE le manifeste fusionné, puis remplir.
  #     make argus-build
  #     aapt2 dump permissions build/app/outputs/flutter-apk/app-debug.apk
  #
  # ⚠️ Sans `aapt2` au PATH, `make argus-sec` ne peut pas lire ce manifeste : il
  # le dit et SAUTE ce contrôle, il ne le passe pas en vert. Poser cette liste
  # avant d'avoir aapt2 revient à régler quelque chose qu'on ne peut pas encore
  # mesurer.
  # ⚠️ DÉRIVE CETTE LISTE DU MANIFESTE FUSIONNÉ DE LA RELEASE, pas du debug.
  # Les deux diffèrent : un build debug embarque des permissions que la
  # publication n'a pas (et l'inverse arrive avec les règles de shrinking).
  # Remplie depuis un debug, cette liste déclare « attendu » ce que
  # l'utilisateur ne recevra jamais — et tait ce qu'il recevra.
  #   aapt2 dump permissions build/app/outputs/flutter-apk/app-release.apk
  expectedPermissions:
    - android.permission.INTERNET
  # Permissions qui font échouer immédiatement si présentes.
  forbiddenPermissions:
    - android.permission.READ_SMS
    - android.permission.RECEIVE_SMS
    - android.permission.READ_CONTACTS
    - android.permission.ACCESS_FINE_LOCATION
  # Drapeaux du manifeste Android exigés en release.
  requireDebuggableOff: true
  requireCleartextDisabled: true
  requireAllowBackupOff: true
  # Exiger `--obfuscate --split-debug-info` sur les builds release.
  #
  # ⚠️ Le contrôle cherche les chemins `package:<name du pubspec>/….dart` dans
  # libapp.so, et RIEN D'AUTRE. Les chemins du framework (`package:flutter/…`)
  # survivent à `--obfuscate` : les compter rendait le même verdict sur un
  # binaire obfusqué et sur un binaire qui ne l'est pas. Ils servent désormais de
  # contre-épreuve — leur absence dit que la lecture a échoué, et la dimension
  # se marque « non jugée » plutôt que verte.
  requireObfuscation: true
  # Motifs de secrets cherchés dans le binaire ET dans les sources.
  # Repris du harness web (argus.config.ts) + spécifiques mobile.
  secretPatterns:
    - 'AKIA[0-9A-Z]{16}'                                          # AWS access key id
    - 'sk_live_[0-9a-zA-Z]{16,}'                                  # Stripe live secret
    - 'AIza[0-9A-Za-z\-_]{35}'                                    # Google API key
    - 'ghp_[0-9A-Za-z]{36}'                                       # GitHub PAT
    - 'xox[baprs]-[0-9A-Za-z-]{10,}'                              # Slack token
    - '-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'    # clé privée
    - 'ya29\.[0-9A-Za-z\-_]+'                                     # jeton OAuth Google
    - 'eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.'            # JWT signé en dur
    - 'sk-[A-Za-z0-9]{32,}'                                       # clé de type OpenAI
    - '[sS]tore[pP]assword\s*=\s*\S+'                             # keystore Android
    - '[kK]ey[pP]assword\s*=\s*\S+'
  # Fichiers où un motif ci-dessus est ATTENDU et légitime : la clé `AIza` de
  # google-services.json est une clé client publique, pas une fuite. Sans cette
  # liste, chaque run remonterait le même faux positif — et un rapport qui crie
  # au loup à chaque fois finit par ne plus être lu.
  #
  # ⚠️ N'y liste QUE des fichiers VERSIONNÉS. Le scan ne parcourt que ce que git
  # suit : un fichier gitignoré (`android/key.properties`, `.env`) n'est déjà pas
  # regardé, donc l'inscrire ne dispense rien — mais ressemble à une décision de
  # sécurité, et plus personne ne la remet en cause. `make argus-sec` signale
  # désormais les entrées qui ne dispensent aucun fichier scanné.
  allowSecretsIn:
    - android/app/google-services.json
    - ios/Runner/GoogleService-Info.plist
  # Sévérité SCA (osv-scanner) qui fait échouer.
  scaFailOn: high

# ── Budget d'exécution ─────────────────────────────────────────────────────
# Le runner mesure ce que le run a coûté et le compare à ces deux plafonds : il
# AVERTIT au dépassement et publie le relevé dans `run.budget` du rapport. Il ne
# tronque rien et ne fait pas échouer — dépasser un budget dit quelque chose de
# la capacité, pas de l'application, et faire rougir la CI là-dessus apprendrait
# à ignorer le rouge. Mettre 0 désactive le plafond.
budget:
  maxMinutes: 25
  maxFlows: 40

# ── Gating CI ──────────────────────────────────────────────────────────────
# Sévérités et exit codes IDENTIQUES au skill web : 0 vert · 1 major · 2 blocker
# ou critical. Voir references/methodology-mobile.md §8.
gate:
  failOn: [blocker, critical, major]
  # Pas de `failOnNewFinding` : le harnais ne conserve aucun run précédent, donc
  # rien ne saurait dire lequel est « nouveau ». Le promettre aurait laissé
  # croire à un gating différentiel qui n'existe pas.
  failOnVisualDiff: true
  # Une suite où AUCUN flow n'a réellement tourné (toutes les ancres vides) sort
  # en exit 2. Sans cette règle, un scaffold neuf rendrait un vert parfait en
  # ne testant rien — le pire résultat possible pour une garde de non-régression.
  failOnEmptyRun: true

# ── Artefacts ──────────────────────────────────────────────────────────────
artifacts:
  dir: argus-mobile-report
  # Baselines de régression visuelle. ⚠️ Elles sont liées au COUPLE device+OS :
  # une baseline générée sur ton simulateur ne correspondra jamais au rendu de
  # l'émulateur de la CI. Génère-les sur la même image que la CI (même piège que
  # les snapshots Playwright du skill web).
  baselines: .maestro/_baselines

# ── Publication du rapport ─────────────────────────────────────────────────
# Le rapport HTML peut être publié comme page consultable, en plus des fichiers
# du dossier ci-dessus. C'est l'agent qui publie : les scripts n'en ont pas le
# moyen, et une CI n'a pas d'agent — un job produira donc toujours le fichier,
# jamais l'URL.
#
# ⚠️ Publier ENVOIE le rapport à un service tiers. La page est privée par
# défaut, ce qui veut dire « pas partagée avec d'autres », pas « restée sur ta
# machine » : le contenu est bien hébergé ailleurs, et une page privée se
# partage d'un clic. Sur une application sous contrat, vérifie que c'est permis
# AVANT d'activer — d'où le défaut ci-dessous.
artifact:
  enabled: false
  # Renseignée à la première publication, puis réutilisée : sans elle, chaque
  # run créerait une page de plus au lieu de mettre la sienne à jour.
  url: ''
  # TODO(argus): le nom de la page. Vide = « Rapport Argus Mobile ». Le garder
  # STABLE : c'est ainsi qu'on la retrouve parmi les autres.
  title: ''
  # Captures des findings embarquées dans la page : all | major | none.
  # « none » laisse les chemins, comme dans le rapport local : rien de l'app ne
  # part, mais la page ne se suffit plus à elle-même.
  evidence: all
  # Plafond de la page. Ce qui ne rentre pas est ANNONCÉ dans le rapport, jamais
  # retiré en silence — une preuve absente sans un mot se lit « pas de preuve ».
  maxMb: 12
