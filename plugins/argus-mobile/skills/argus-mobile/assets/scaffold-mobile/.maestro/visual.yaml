# ARGUS:CADRE — au plugin : `install-mobile.sh --update` remplace ce fichier.
appId: ${APP_ID}
name: Argus — régression visuelle
tags:
  - argus
  - visual
---
# Régression visuelle d'UN écran, désigné par ARGUS_SCREEN_ID / ARGUS_SCREEN_ANCHOR.
# C'est le RUNNER qui boucle sur `screens[].visual` et rappelle ce flow une fois
# par écran : un flow Maestro ne sait pas itérer sur une liste d'écrans, et
# surtout il ne saurait pas NAVIGUER vers chacun d'eux.
#
# Deux modes, pilotés par ARGUS_VISUAL_MODE :
#   update → `takeScreenshot` produit la référence, que le runner recopie dans
#            argus.mobile.yaml → artifacts.baselines
#   assert → `assertScreenshot` compare à cette référence
#
# Et un cadrage, ARGUS_VISUAL_CROP, injecté depuis `visualCropOn`. Maestro n'a
# aucun masquage de pixels : recadrer sur un conteneur stable est le seul levier
# qui reste depuis un flow pour sortir du cadre ce qui bouge tout seul —
# l'horloge du système en tête.
#
# ⚠️ `thresholdPercentage` est un POURCENTAGE DE CORRESPONDANCE REQUIS (défaut
# Maestro : 95), pas un ratio de différence. 99 = on tolère 1 % de pixels
# divergents. Y mettre 0.01 accepterait n'importe quelle image.
#
# ⚠️ Les baselines sont liées au couple device + version d'OS. Une référence
# produite sur ton simulateur ne correspondra JAMAIS au rendu de l'émulateur de
# la CI : génère-les sur la même image que la CI.

- runFlow: _subflows/launch-clean.yaml

- runFlow:
    when:
      true: "${typeof ARGUS_SCREEN_ANCHOR !== 'undefined' && ARGUS_SCREEN_ANCHOR !== ''}"
    commands:
      - runFlow:
          file: _subflows/goto.yaml
          env:
            SCREEN_ID: ${ARGUS_SCREEN_ID}

      - extendedWaitUntil:
          visible:
            id: ${ARGUS_SCREEN_ANCHOR}
          timeout: ${ARGUS_START_TIMEOUT_MS}
          label: Écran cible affiché avant capture

      - runFlow: _subflows/mask-dynamic.yaml

      # ── mode update : produire la référence ──────────────────────────────
      #
      # ⚠️ Deux branches par mode, parce qu'un sélecteur VIDE ne se passe pas à
      # `cropOn:` — Maestro chercherait un élément d'identifiant « » et
      # échouerait. `visualCropOn` vide veut dire « plein écran », pas
      # « recadre sur rien ».
      - runFlow:
          when:
            true: "${typeof ARGUS_VISUAL_MODE !== 'undefined' && ARGUS_VISUAL_MODE === 'update' && (typeof ARGUS_VISUAL_CROP === 'undefined' || ARGUS_VISUAL_CROP === '')}"
          commands:
            - takeScreenshot:
                path: ${ARGUS_SCREEN_ID}
                label: Nouvelle référence visuelle (plein écran)

      - runFlow:
          when:
            true: "${typeof ARGUS_VISUAL_MODE !== 'undefined' && ARGUS_VISUAL_MODE === 'update' && typeof ARGUS_VISUAL_CROP !== 'undefined' && ARGUS_VISUAL_CROP !== ''}"
          commands:
            - takeScreenshot:
                path: ${ARGUS_SCREEN_ID}
                cropOn:
                  id: ${ARGUS_VISUAL_CROP}
                label: Nouvelle référence visuelle, recadrée

      # ── mode assert : comparer ───────────────────────────────────────────
      # Le chemin de référence est ABSOLU et injecté par le runner. La doc
      # Maestro ne précise nulle part depuis quelle racine un chemin RELATIF
      # serait résolu ; plutôt que de le deviner, on passe un chemin qui ne
      # dépend d'aucune racine. Éprouvé sur device (Maestro 2.8.0) : génération
      # de la référence, comparaison conforme, puis détection d'une référence
      # corrompue.
      #
      # ⚠️ « The comparison screenshot must also have been cropped » — doc de
      # Maestro. Le cadrage de l'assertion DOIT être celui de la génération :
      # les deux branches lisent donc la même variable, et le runner refuse de
      # comparer sous un cadrage qui a changé depuis les références.
      - runFlow:
          when:
            true: "${(typeof ARGUS_VISUAL_MODE === 'undefined' || ARGUS_VISUAL_MODE !== 'update') && (typeof ARGUS_VISUAL_CROP === 'undefined' || ARGUS_VISUAL_CROP === '')}"
          commands:
            - assertScreenshot:
                path: ${ARGUS_BASELINE_DIR}/${ARGUS_SCREEN_ID}.png
                thresholdPercentage: ${ARGUS_VISUAL_THRESHOLD}
                label: Comparaison à la référence visuelle (plein écran)

      - runFlow:
          when:
            true: "${(typeof ARGUS_VISUAL_MODE === 'undefined' || ARGUS_VISUAL_MODE !== 'update') && typeof ARGUS_VISUAL_CROP !== 'undefined' && ARGUS_VISUAL_CROP !== ''}"
          commands:
            - assertScreenshot:
                path: ${ARGUS_BASELINE_DIR}/${ARGUS_SCREEN_ID}.png
                cropOn:
                  id: ${ARGUS_VISUAL_CROP}
                thresholdPercentage: ${ARGUS_VISUAL_THRESHOLD}
                label: Comparaison à la référence visuelle, recadrée

- runFlow:
    when:
      true: "${typeof ARGUS_SCREEN_ANCHOR === 'undefined' || ARGUS_SCREEN_ANCHOR === ''}"
    commands:
      - assertTrue:
          condition: "${true}"
          label: 'SKIP visuel — lance `node scripts/argus/run.mjs`, qui boucle sur screens[].visual'
