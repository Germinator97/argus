appId: ${APP_ID}
# ARGUS:OWNED — à toi : l'installeur ne l'écrase ni ne le compare, jamais.
# ⚠️ Un sous-flow DOIT porter une section de configuration, même s'il n'est
# jamais exécuté directement : Maestro valide TOUS les fichiers YAML du
# workspace au démarrage, et rejette celui qui n'en a pas
# (« Config Section Required »). Le glob `flows` de config.yaml décide de ce qui
# s'EXÉCUTE, pas de ce qui se PARSE.
---
# Neutralisation des zones non déterministes AVANT capture.
#
# ⚠️ Maestro n'a PAS de masquage de pixels : l'équivalent de `dynamicSelectors`
# du harness web n'existe pas. Seul `cropOn` permet de restreindre la capture.
# Ce sous-flow fait donc la seule chose qui reste possible depuis un flow :
# amener l'écran dans un état stable avant de le photographier.
#
# Trois leviers, du plus fiable au moins fiable :
#   1. figer la DONNÉE (horloge, solde, jeu de test) — côté app, via les
#      `arguments` de launchApp ou un environnement de test dédié ;
#   2. FERMER ce qui flotte (bannières, toasts, tooltips) — ci-dessous ;
#   3. RECADRER sur un conteneur stable — `visualCropOn` dans argus.mobile.yaml.
#      Ce n'est PAS ce sous-flow qui l'applique : le runner l'injecte et
#      visual.yaml le pose sur la capture comme sur la comparaison. Rien à
#      écrire ici pour en profiter.
#
# Ce qu'il ne faut PAS faire : relâcher `visualMatchPercentage`. Ça masque les
# zones dynamiques ET les vraies régressions, sans distinction.

# Laisse retomber toute animation d'entrée avant de capturer.
- waitForAnimationToEnd:
    timeout: 5000

# TODO(argus): ferme ici ce qui flotte au-dessus de tes écrans. Garde
# `optional: true` : ces éléments n'apparaissent pas à tous les runs, et leur
# absence ne doit pas faire échouer la capture.
# - tapOn:
#     id: banner_dismiss
#     optional: true
#     label: Ferme la bannière promotionnelle si elle est là
# ⚠️ Encadre le motif (`(?s).*…​.*`) : le sélecteur matche le nœud ENTIER, et sur
# Flutter un nœud fusionne le texte qu'il recouvre. Avec `optional: true`, un
# motif trop étroit échoue en SILENCE : l'invite reste ouverte et pollue toutes
# les captures, sans une ligne dans le journal.
#
# ⚠️ ET LE TROP LARGE EST PIRE, parce qu'il TAPE quelque chose. Mesuré sur un
# projet réel : `(?s).*(Erreur|Validation|Diagnostic).*` a attrapé la section
# « DIAGNOSTIC » d'un écran de réglages, dont le tap ENVOYAIT un événement de
# télémétrie ; la bannière de confirmation a ensuite pollué la capture et fait
# diverger la référence à 98,6 %. Un `optional: true` qui tape la mauvaise chose
# ne laisse aucune trace non plus — mais il a agi.
#
# D'où l'ordre des deux exemples ci-dessus : cibler par `id:` est la seule forme
# qui sait CE QU'ELLE TOUCHE. Le ciblage par texte est le repli, quand la chose
# qui flotte n'est pas à toi et que tu ne peux pas lui poser d'ancre. Si elle est
# à toi, donne-lui une ancre — c'est trois lignes de Dart contre un motif qu'il
# faudra relire à chaque libellé ajouté.
# - tapOn:
#     text: '(?s).*Plus tard.*'
#     optional: true
#     label: Ferme l'invite de mise à jour si elle est là
