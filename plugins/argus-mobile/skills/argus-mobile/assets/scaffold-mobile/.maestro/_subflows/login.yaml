appId: ${APP_ID}
# ARGUS:OWNED — à toi : l'installeur ne l'écrase ni ne le compare, jamais.
#
# ⚠️ CE MARQUEUR EST LA MOITIÉ QUI MANQUAIT. `argus.mobile.yaml` dit, au-dessus
# de la clé `auth`, que la forme de l'authentification « ne se déclare pas :
# elle s'écrit, dans .maestro/_subflows/login.yaml ». Sans marqueur, ce fichier
# tombait dans la branche `cp` de `--update` : le parcours métier du projet
# était ÉCRASÉ par la version générique. Et l'utilisateur ne pouvait rien y
# faire, l'installeur classant d'après la SOURCE et jamais d'après sa copie.
#
# ⚠️ Un sous-flow DOIT porter une section de configuration, même s'il n'est
# jamais exécuté directement : Maestro valide TOUS les fichiers YAML du
# workspace au démarrage, et rejette celui qui n'en a pas
# (« Config Section Required »). Le glob `flows` de config.yaml décide de ce qui
# s'EXÉCUTE, pas de ce qui se PARSE.
---
# Authentification paramétrée. AUCUN identifiant en dur : QA_USER et QA_PASS sont
# lus dans l'environnement par le runner et injectés via `maestro test -e`.
#
# ⚠️ `label:` masque la valeur saisie dans la console et dans les rapports, MAIS
# la doc Maestro est explicite : « the actual values remain visible in raw
# internal debug logs ». Ne publie donc JAMAIS le contenu de `--debug-output`
# comme artefact CI ouvert. Voir SKILL.md §5.
#
# Le bloc entier skippe si les secrets OU les ancres manquent : une suite qui
# tente de se connecter sans identifiants échoue pour la mauvaise raison, et on
# passe une heure à chercher un bug applicatif qui n'existe pas.
#
# ⚠️ `ARGUS_AUTH_READY` vaut '1' quand les CINQ ancres sont renseignées, et la
# décision est prise dans `run.mjs` (`authAnchorsReady`) parce qu'un garde peut
# l'y exercer. Cette condition ne testait que le champ identifiant : renseigner
# celui-là et laisser l'écran vide faisait partir un `assertVisible` sur un id
# vide — l'échec à mi-parcours que le commentaire promettait justement d'éviter.
# TODO(argus): RÉÉCRIS CE BLOC si ton authentification n'est pas un formulaire à
# deux champs. Ce qui suit est un exemple qui marche pour le cas le plus simple ;
# ce fichier t'appartient, et c'est ici — pas dans une clé de configuration —
# que se décrit un parcours en plusieurs écrans (identifiant, puis code à usage
# unique, puis code secret), un SSO ou une biométrie.
#
# ⚠️ Les cinq `auth.anchors` ne décrivent qu'un formulaire. Sur un parcours en
# plusieurs temps, leur seul rôle effectif est d'ouvrir la porte
# (`ARGUS_AUTH_READY`) et de dire où elle mène (`ARGUS_AUTH_SUCCESS`) : renseigne
# les trois premières avec les ancres du PREMIER écran, `success` avec celle qui
# prouve la session ouverte, et écris la vraie séquence ci-dessous.
- runFlow:
    when:
      true: "${typeof QA_USER !== 'undefined' && QA_USER !== '' && typeof ARGUS_AUTH_READY !== 'undefined' && ARGUS_AUTH_READY !== ''}"
    commands:
      - assertVisible:
          id: ${ARGUS_AUTH_SCREEN}
          label: Écran de connexion affiché

      - tapOn:
          id: ${ARGUS_AUTH_USER}
          label: Champ identifiant
      # ⚠️ LA FORME LONGUE, POUR LE `label:`. Écrite en forme courte, la valeur
      # saisie apparaît EN CLAIR en console et dans les rapports — pendant que le
      # mot de passe, deux lignes plus bas, était bien masqué. L'intention était
      # juste partout ailleurs : l'en-tête de ce fichier explique le mécanisme, et
      # le runner masque les deux dans la ligne de commande qu'il imprime. Un
      # identifiant de test est couramment un e-mail ou un numéro, et il part
      # dans le rapport publié.
      - inputText:
          text: ${QA_USER}
          label: Saisie de l'identifiant du compte de test

      - tapOn:
          id: ${ARGUS_AUTH_PASS}
          label: Champ mot de passe
      - inputText:
          text: ${QA_PASS}
          label: Saisie du mot de passe du compte de test

      - tapOn:
          id: ${ARGUS_AUTH_SUBMIT}
          label: Validation de la connexion

      # 🔴 REFERMER CE QUE LA CONNEXION VIENT DE FAIRE NAÎTRE, ET C'EST UNE
      # COURSE (405, 412). `launch-clean.yaml` joue déjà ce geste au LANCEMENT,
      # pour tous les flows — mais beaucoup d'applications ne demandent leurs
      # permissions qu'APRÈS la connexion, au montage de l'accueil. Le geste doit
      # donc être joué là où l'invite NAÎT, pas seulement là où tous les flows
      # passent : n'avoir que la seconde moitié a coûté trois flows rouges sur un
      # projet réel, plus un quatrième vert par simple chronométrage.
      #
      # ⚠️ ET LE POSER APRÈS L'ATTENTE NE SUFFIT PAS — c'était la première forme
      # de ce correctif, et un run l'a démentie. Quand l'accueil monte son bloc
      # d'amorçage en `lazy: false`, l'invite naît pendant qu'`extendedWaitUntil`
      # COURT DÉJÀ : elle recouvre l'écran attendu, l'attente expire, et l'échec
      # accuse une ancre correcte. Ce n'est pas un ordre à corriger, c'est une
      # course — d'où le `retry` qui rejoue la PAIRE. Un premier tour referme ce
      # qui existait au lancement ; si l'invite naît en cours d'attente, le second
      # la referme et réattend.
      #
      # Le tap du sous-flow est `optional: true` : sans invite, chaque passage ne
      # coûte rien. ⚠️ Le chemin est relatif au DOSSIER DE CE FICHIER — depuis un
      # flow de `.maestro/`, il s'écrit `_subflows/dismiss-system-alerts.yaml`.
      # Maestro ne le dira qu'au lancement, en refusant le workspace entier.
      - retry:
          maxRetries: 2
          commands:
            - runFlow: dismiss-system-alerts.yaml
            # Attendre un ÉTAT, jamais un délai. `extendedWaitUntil` laisse au
            # réseau le temps de répondre sans immobiliser la suite quand il
            # répond vite.
            - extendedWaitUntil:
                visible:
                  id: ${ARGUS_AUTH_SUCCESS}
                timeout: ${ARGUS_START_TIMEOUT_MS}
                label: Session ouverte (ancre post-connexion visible)

- runFlow:
    when:
      true: "${typeof QA_USER === 'undefined' || QA_USER === '' || typeof ARGUS_AUTH_READY === 'undefined' || ARGUS_AUTH_READY === ''}"
    commands:
      - assertTrue:
          condition: "${true}"
          label: 'SKIP connexion — QA_USER absent de l''environnement ou auth.anchors vide dans argus.mobile.yaml'
