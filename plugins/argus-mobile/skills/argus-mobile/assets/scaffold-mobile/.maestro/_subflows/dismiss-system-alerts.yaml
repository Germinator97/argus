appId: ${APP_ID}
# ARGUS:OWNED — à toi : l'installeur ne l'écrase ni ne le compare, jamais.
# ⚠️ Un sous-flow DOIT porter une section de configuration, même s'il n'est
# jamais exécuté directement : Maestro valide TOUS les fichiers YAML du
# workspace au démarrage, et rejette celui qui n'en a pas.
---
# Les modales que le SYSTÈME présente lui-même, et que `permissions.all: allow`
# ne couvre pas — il accorde les permissions du bac à sable, jamais l'alerte que
# l'OS affiche au premier `requestAuthorization`.
#
# 🔴 POURQUOI CE FICHIER EXISTE, ET PAS UNE LIGNE DANS goto.yaml (396). Le geste
# a d'abord été prescrit dans `goto.yaml`, qui appartient bien au projet — mais
# qui n'a **qu'un seul appelant** dans le scaffold livré, `visual.yaml`. Six flows
# sur huit entrent par `launch-clean.yaml`. Le geste était donc au bon endroit du
# point de vue de la PROPRIÉTÉ et au mauvais du point de vue de l'ATTEINTE : il ne
# se jouait presque jamais, et avec `optional: true` il ne se plaignait pas.
# Ce fichier-ci est appelé par `launch-clean.yaml`, donc par tous les flows, tout
# en restant à toi.
#
# 🔴 ET IL EST APPELÉ DEUX FOIS, CE QUI N'EST PAS UN OUBLI (405). Corriger
# l'ATTEINTE avait cassé le MOMENT : `launch-clean.yaml` joue le geste au
# LANCEMENT, alors que beaucoup d'applications ne demandent leurs permissions
# qu'APRÈS la connexion, au montage de l'accueil. L'invite naissait donc une fois
# le lancement fini, et rien ne la refermait — trois flows rouges sur un projet
# réel, plus un quatrième vert par simple chronométrage, donc un faux succès.
# `login.yaml` porte le second appel. La règle qui reste, quand tu adaptes :
# **le geste se joue là où l'invite NAÎT**, autant de fois qu'il le faut ; le
# `optional: true` rend chaque passage inoffensif quand il n'y a rien à fermer.
#
# ⚠️ MESURÉ, PAS SUPPOSÉ — un run avait conclu l'inverse. L'arbre relevé PENDANT
# que l'alerte est affichée porte bien « Autorisez-vous … », « Refuser » et
# « Autoriser » : elle EST dans ce que Maestro interroge, et le `tapOn` ci-dessous
# la ferme (vérifié par le dump suivant : alerte partie, app revenue). Le run qui
# a conclu le contraire avait pris sa capture et son dump à deux instants
# différents, sur un simulateur dont SpringBoard venait de tomber.
#
# ⚠️ ADAPTE LES LIBELLÉS À TA LANGUE ET À TES PERMISSIONS. Ceux-ci couvrent
# l'alerte de notifications en français et en anglais. Si ton app demande la
# localisation, la caméra ou le suivi, ajoute leurs boutons ici.
# ⚠️ LA TOLÉRANCE EST NÉCESSAIRE, LA FORME NON : l'alerte n'apparaît qu'une fois
# par installation, donc un tap inconditionnel ferait rougir tous les runs
# suivants sur un parcours sain. Mais toute forme qui INTERROGE L'ARBRE pour le
# savoir ne renonce pas tout de suite — elle attend sa borne, à chaque flow.
# Mesuré : ~7,3 s par flow, ~44 s par suite, et la mesure de démarrage ABSORBÉE
# sur 7 flows sur 8 (55-66 ms retenus derrière ~7 080 ms d'attente). Un budget
# qu'aucune valeur ne peut dépasser a toutes les apparences d'un budget tenu (516).
#
# 🔴 ET LE PREMIER REMÈDE ÉTAIT FAUX — c'est le 517, et il vaut d'être lu. Le
# 516 avait remplacé `tapOn … optional: true` par ce `when: visible:` en écrivant
# « un `when:` s'ÉVALUE ; une assertion optionnelle ATTEND ». La phrase est fausse
# du `when: visible:`, qui interroge l'arbre lui aussi. Mesuré sur le fichier
# LIVRÉ, trois répétitions, témoin à 8,5 s :
#
#     when: visible: sur élément ABSENT   14,87 / 14,93 / 14,80  → ~6,4 s
#     tapOn … optional: true              15,06 / 14,79 / 15,03  → ~6,4 s
#     when: visible: sur élément PRÉSENT    8,27 /  8,14 /  8,16  → ~0
#     when: true: (expression JS) fausse    8,24 /  8,21 /  8,18  → ~0
#
# Le coût n'avait pas bougé : `precedeMs` ~7,1 s, et l'absorption est passée de
# 7/8 à **10/10**. Le 486 est juste parce qu'il conditionne sur une EXPRESSION,
# pas parce qu'il emploie le mot `when` ; le 516 a recopié le mot sans la raison.
# ⚠️ Et `timeout:` est refusé dans un `when:` (`Unknown Property: timeout`) : la
# borne n'est pas réglable, il faut donc ne PAS poser la question quand aucune
# invite ne peut naître. C'est ce que fait le `when: true:` extérieur ci-dessous,
# dont la valeur est dérivée de `security.expectedPermissions` par le runner.
# ⚠️ Et le sélecteur est ENCADRÉ (`(?s).*…*`) : un sélecteur porte sur le nœud
# ENTIER, et un nœud fusionne le texte qu'il recouvre.
# TODO(argus): adapte les libellés à ta langue et ajoute les autres invites que
# ton app déclenche — localisation, caméra, suivi. Retire ce TODO quand c'est
# fait, ou écris en une ligne pourquoi la valeur livrée te suffit.
- runFlow:
    when:
      true: "${typeof ARGUS_SYSTEM_ALERTS === 'undefined' || ARGUS_SYSTEM_ALERTS === 'true'}"
    commands:
      - runFlow:
          when:
            visible:
              text: '(?s).*(Refuser|Don.t Allow).*'
          commands:
            - tapOn:
                text: '(?s).*(Refuser|Don.t Allow).*'
                label: Refermer l'invite système, si elle recouvre l'écran
