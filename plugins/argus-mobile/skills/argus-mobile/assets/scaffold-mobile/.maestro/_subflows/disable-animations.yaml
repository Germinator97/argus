# ARGUS:CADRE — au plugin : `install-mobile.sh --update` remplace ce fichier.
appId: ${APP_ID}
# ⚠️ Un sous-flow DOIT porter une section de configuration, même s'il n'est
# jamais exécuté directement : Maestro valide TOUS les fichiers YAML du
# workspace au démarrage, et rejette celui qui n'en a pas
# (« Config Section Required »). Le glob `flows` de config.yaml décide de ce qui
# s'EXÉCUTE, pas de ce qui se PARSE.
---
# ⚠️ CE SOUS-FLOW NE DÉSACTIVE PAS LES ANIMATIONS — il vérifie qu'elles l'ont été.
#
# Pourquoi il ne peut pas les couper lui-même :
#   1. la sandbox JavaScript de Maestro (GraalJS) n'a ni accès au système de
#      fichiers ni accès au shell : aucun flow ne peut appeler `adb` ;
#   2. `platform.android.disableAnimations` du config.yaml est une option
#      MAESTRO CLOUD UNIQUEMENT, sans effet sur un émulateur local.
#
# C'est donc `scripts/argus/run.mjs` qui les coupe avant la suite :
#   adb shell settings put global window_animation_scale 0
#   adb shell settings put global transition_animation_scale 0
#   adb shell settings put global animator_duration_scale 0
# Les TROIS comptent : n'en couper que deux laisse passer assez de mouvement pour
# rendre une capture instable.
#
# Ce garde affiche ⚠️ quand ça n'a pas été fait, plutôt que de porter un nom qui
# ment. `optional: true` pour qu'un run direct (`maestro test .maestro`) reste
# possible : il sera simplement non déterministe, et le dira.
# ⚠️ ET IL NE SE JOUE QUE LÀ OÙ LE GESTE A UN SENS (486). Sur une plateforme
# sans équivalent local à `settings put`, `disableAnimations` rend `ok: false` —
# à raison —, la condition ci-dessous est donc fausse PAR CONSTRUCTION, et un
# `assertTrue … optional: true` n'échoue pas vite : il attend sa BORNE. Mesuré
# sur un simulateur iOS : 1898 ms, à chaque flow, six flows, ~11 s par passe pour
# un geste que la plateforme ne peut pas exécuter.
#
# La distinction est celle entre « j'ai mesuré, et c'est NON » — sur Android, où
# un `settings put` peut échouer en silence et où le signal compte — et « il n'y
# a RIEN À CONCLURE ici ». Un `when:` s'ÉVALUE ; une assertion optionnelle ATTEND.
#
# Le `typeof … === 'undefined'` garde le comportement d'avant quand la variable
# n'est pas injectée : un flow lancé à la main continue de vérifier.
- runFlow:
    when:
      true: "${typeof ARGUS_ANIMATIONS_APPLICABLE === 'undefined' || ARGUS_ANIMATIONS_APPLICABLE === 'true'}"
    commands:
      - assertTrue:
          condition: "${typeof ARGUS_ANIMATIONS_DISABLED !== 'undefined' && ARGUS_ANIMATIONS_DISABLED === 'true'}"
          optional: true
          label: Animations coupées par le runner (sinon captures et timings instables)
