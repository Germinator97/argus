# ARGUS:CADRE — au plugin : `install-mobile.sh --update` remplace ce fichier.
appId: ${APP_ID}
# ⚠️ Un sous-flow DOIT porter une section de configuration, même s'il n'est
# jamais exécuté directement : Maestro valide TOUS les fichiers YAML du
# workspace au démarrage, et rejette celui qui n'en a pas
# (« Config Section Required »). Le glob `flows` de config.yaml décide de ce qui
# s'EXÉCUTE, pas de ce qui se PARSE.
---
# Point d'entrée de TOUS les flows Argus : état vidé, app lancée, écran stable.
#
# `clearState: true` avant chaque flow est la première règle anti-flake mobile.
# Sans elle, un flow hérite de l'onboarding déjà passé, du cache et de la session
# du flow précédent : son résultat dépend alors de l'ordre d'exécution, ce qui est
# la définition même d'une suite non déterministe.
#   Android : équivalent de `adb shell pm clear <package>` — emporte TOUT,
#             trousseau compris.
#   iOS     : Maestro RÉINSTALLE l'app (plus lent) — mais l'état n'est PAS neuf :
#             le TROUSSEAU survit à la suppression, donc les jetons de session
#             aussi. Mesuré sur un projet réel : le premier flow atteint l'écran
#             d'identification en 78-142 ms, les cinq suivants expirent à
#             ~20 200 ms parce que l'app y démarre APRÈS la connexion — et
#             l'échec accuse l'ancre, qui est correcte.
#             🔴 ET MAESTRO PORTE LA PRIMITIVE — le harnais l'ignorait. Le
#             premier remède posait `resetKeychain` dans `run.mjs`
#             (`xcrun simctl keychain <udid> reset`) « parce que la sandbox de
#             Maestro n'a ni shell ni système de fichiers ». C'était vrai de
#             `xcrun`, et faux de Maestro : `clearKeychain: true` existe depuis
#             2.8.0. Or `resetKeychain` a UN SEUL site d'appel, avant la boucle
#             des flows, quand `clearState` s'exécute avant CHACUN — le trousseau
#             n'était donc vidé qu'une fois, le premier flow ouvrait une session,
#             et tous les suivants en héritaient. *Ce qui isole doit s'exécuter à
#             la même cadence que ce qu'il isole.*
#             Mesuré sur appareil, trousseau volontairement sali, dans les deux
#             sens : `clearState` seul → l'ancre de départ ÉCHOUE ;
#             `clearState` + `clearKeychain` → elle PASSE. Et sur Android le
#             drapeau est inoffensif (témoin sans lui : COMPLETED ; avec lui :
#             COMPLETED), donc il n'a pas besoin d'être gardé par plateforme.
#             `resetKeychain` RESTE dans le runner : il nettoie ce qu'un run
#             précédent a laissé, y compris pour les flows qui n'entrent pas par
#             ce sous-flow.
#
# `permissions.all: allow` est déjà le défaut de Maestro ; il est écrit ici pour
# être explicite — resilience.yaml refait un `launchApp` avec `all: deny` pour
# éprouver le parcours inverse.
#
# 🔴 ET IL NE COUVRE PAS L'ALERTE SYSTÈME DES NOTIFICATIONS SUR iOS. Mesuré sur
# iOS 26.3 avec Maestro 2.8.0 : `permissions.all: allow` accorde les permissions
# du bac à sable, pas la modale que le SYSTÈME présente au premier
# `requestAuthorization`. Un seul flow qui la laisse ouverte fait échouer les
# CINQ suivants — et l'échec accuse l'ancre de l'écran, qui est correcte : la
# capture montrait l'accueil ENTIÈREMENT rendu derrière l'alerte pendant que le
# flow rapportait `home_root` introuvable.
#   Le geste qui la ferme dépend de ta langue et de ton app, donc il ne peut pas
#   vivre ICI — ce fichier appartient au cadre et serait écrasé. Pose-le dans
#   `_subflows/goto.yaml`, qui est à toi, juste après le lancement :
#     - runFlow:
#         when:
#           visible: 'Autoriser'        # ou 'Allow', selon la langue du système
#         commands:
#           - tapOn: 'Autoriser'
#   ⚠️ En syntaxe BLOC, jamais en map de flow (`{ visible: … }`) : Maestro
#   l'accepterait, mais le sous-ensemble YAML d'Argus non — et un exemple se
#   recopie. C'est le défaut 256, et c'est son garde qui m'a repris ici.
#   ⚠️ Un `tapOn` inconditionnel échouerait sur les runs suivants, où l'alerte
#   n'apparaît plus : c'est le `when:` qui rend le geste rejouable.
- launchApp:
    clearState: true
    # Le pendant iOS de `clearState`, à la MÊME cadence que lui. Inoffensif sur
    # Android, où `pm clear` a déjà tout emporté — mesuré, pas supposé.
    clearKeychain: true
    permissions:
      all: allow
    label: Lancement à état vide (clearState + clearKeychain)

- runFlow: disable-animations.yaml

# 🔴 L'INVITE SYSTÈME SE FERME ICI, PARCE QU'ICI EST LE SEUL ENDROIT QUE TOUS LES
# FLOWS TRAVERSENT (396). Le geste a d'abord été prescrit dans `goto.yaml` — à toi,
# donc jamais écrasé, mais appelé par UN seul flow du scaffold. Le sous-flow
# appelé ci-dessous t'appartient aussi, et il est joué par tous.
#
# ⚠️ MAIS « ICI » NE SUFFIT PAS, ET LE CROIRE A COÛTÉ (405). Corriger l'ATTEINTE
# a déplacé le défaut au lieu de le fermer : ce geste se joue au LANCEMENT, or
# beaucoup d'applications ne demandent leurs permissions qu'APRÈS la connexion,
# au montage de l'accueil. L'invite naît alors une fois ce flow terminé, et rien
# ne la referme. `login.yaml` porte donc le MÊME appel après son
# `extendedWaitUntil` — les deux moments sont nécessaires, et ils ne se
# remplacent pas : un remède ne supprime pas toujours un mode de panne, il le
# déplace. Si ton app demande à un troisième moment, appelle-le là aussi.
- runFlow: dismiss-system-alerts.yaml

# 🔴 L'ORDRE DE CES DEUX ATTENTES EST UNE MESURE, PAS UN STYLE (460).
# `waitForAnimationToEnd` était placé AVANT l'attente d'ancre, et il ABSORBAIT le
# sas de démarrage : le chronomètre de `startup.samples` est la durée de la
# PREMIÈRE attente sur l'ancre, donc il ne relevait plus que le résidu. Mesuré
# sur un projet réel dont le splash de marque tient 2 s : **86 à 130 ms** —
# physiquement impossible si la mesure contenait le splash.
#   Deux conséquences, et la seconde est la pire. Le relevé s'annonce « splash et
#   init compris », ce qui est FAUX sur toute app à splash tenu ; et
#   `thresholds.brandedSplashMs` est SOUSTRAIT de cette mesure, si bien qu'un
#   plancher de 2000 ms retranché de 130 rend 0 — le seuil de démarrage ne peut
#   alors plus jamais rougir. *Un budget qu'aucune valeur ne peut dépasser a
#   toutes les apparences d'un budget tenu.*
#   L'attente d'ancre passe donc EN PREMIER : elle part du lancement, donc elle
#   mesure ce qu'elle prétend mesurer. Rien n'est perdu — son budget
#   (`ARGUS_START_TIMEOUT_MS`) est largement au-dessus du seuil de performance,
#   et il couvre désormais TOUT le sas au lieu de ce qui restait après cinq
#   secondes d'animation.
#
# ⚠️ ET L'ATTENTE D'ANIMATION NE SUFFIRAIT PAS SEULE : `waitForAnimationToEnd`
# rend la main dès que RIEN NE BOUGE, ce qui arrive aussi pendant un splash
# statique. Il plafonne à 5 s, alors
# qu'un démarrage à froid mesuré sur un projet réel va de 6,4 à 9,3 s — jusqu'à
# 22 s sous charge. Tout ce qui suit ce sous-flow tapait donc dans le sas de
# démarrage, et l'échec sortait en « Element not found » : on lit ça comme une
# ancre manquante, et on part chercher un défaut d'instrumentation qui n'existe
# pas. Vécu au sixième run, sur deux flows visuels.
#
# On attend donc un ÉTAT — l'ancre de départ — et non la seule immobilité. Le
# budget est celui du harnais, LARGEMENT au-dessus du seuil de performance, pour
# qu'un démarrage lent sorte en finding de lenteur et pas en échec fonctionnel.
#
# Sans ancre de départ déclarée, on ne peut rien attendre de mieux : on garde le
# comportement d'avant plutôt que d'inventer un délai.
- runFlow:
    when:
      true: "${typeof ARGUS_ANCHOR_HOME !== 'undefined' && ARGUS_ANCHOR_HOME !== ''}"
    commands:
      - extendedWaitUntil:
          visible:
            id: ${ARGUS_ANCHOR_HOME}
          timeout: ${ARGUS_START_TIMEOUT_MS}
          label: Écran de départ affiché — l'app est prête, pas seulement immobile

# L'app est prête : on laisse retomber l'animation d'entrée avant de rendre la
# main. Un `sleep` arbitraire serait soit trop court (flake), soit trop long
# (suite lente) ; il n'est jamais juste. Ici il ne masque plus aucune mesure,
# puisque le démarrage a déjà été chronométré au-dessus.
- waitForAnimationToEnd:
    timeout: 5000
