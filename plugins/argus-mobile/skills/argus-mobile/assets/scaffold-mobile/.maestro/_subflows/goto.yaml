appId: ${APP_ID}
# ARGUS:OWNED — à toi : l'installeur ne l'écrase ni ne le compare, jamais.
# ⚠️ Un sous-flow DOIT porter une section de configuration, même s'il n'est
# jamais exécuté directement : Maestro valide TOUS les fichiers YAML du
# workspace au démarrage, et rejette celui qui n'en a pas
# (« Config Section Required »). Le glob `flows` de config.yaml décide de ce qui
# s'EXÉCUTE, pas de ce qui se PARSE.
---
# Aiguillage de navigation : amène l'app sur l'écran `${SCREEN_ID}`,
# QUEL QUE SOIT L'ENDROIT D'OÙ ELLE PART.
#
# ⚠️ C'EST LE CONTRAT, ET CE N'EST PAS CELUI QU'ON CROIT. `goto` n'est presque
# jamais appelé au lancement : il l'est AU MILIEU d'un flow, après que les blocs
# précédents ont navigué ailleurs. Chaque branche doit donc être écrite comme un
# RETOUR depuis un écran quelconque, jamais comme un aller depuis l'accueil.
#
# Ce que coûte l'oubli : la branche ne fait rien, l'app reste où elle était, et
# c'est l'étape SUIVANTE qui échoue — sur « Element not found: Id matching
# regex: … », donc au mauvais endroit et en accusant l'instrumentation. Deux runs
# y sont passés, dont un qui a perdu une passe device complète (~7 min).
#
# Aucun outil ne peut deviner comment on atteint un écran dans TON app : c'est la
# seule partie du harness qui demande vraiment du travail projet. Chaque branche
# ci-dessous est un `when` sur l'identifiant d'écran déclaré dans
# `argus.mobile.yaml → screens[].id`.
#
# 🔴 UNE INVITE SYSTÈME PEUT RECOUVRIR L'ÉCRAN QUE TU VIENS D'ATTEINDRE, ET LE
# GESTE QUI LA FERME VIT ICI. `permissions.all: allow` accorde les permissions du
# bac à sable, PAS la modale que le système présente lui-même au premier
# `requestAuthorization` — mesuré sur iOS 26.3 avec Maestro 2.8.0. Un seul flow
# qui la laisse ouverte fait échouer les CINQ suivants, et l'échec accuse l'ancre
# de l'écran, qui est correcte : la capture montre l'accueil ENTIÈREMENT rendu
# DERRIÈRE l'alerte.
#
# Le geste dépend de ta langue et de ton app, donc il ne peut pas vivre dans un
# sous-flow du CADRE, qui serait écrasé à la prochaine mise à jour. Deux formes,
# toutes deux exercées sur un projet réel — la première suffit presque toujours :
#
#   - tapOn:
#       text: '(?s).*(Refuser|Don.t Allow).*'   # les libellés de TON système
#       optional: true                          # sauté si l'alerte n'est pas là
#
#   - runFlow:                        # la forme longue, pour grouper plusieurs gestes
#       when:
#         visible: '(?s).*Autoriser.*'
#       commands:
#         - tapOn: '(?s).*Autoriser.*'
#
# ⚠️ Sans `optional:` ni `when:`, le geste échoue dès le SECOND run — l'alerte
# n'apparaît qu'une fois par installation, et un tap inconditionnel devient alors
# une étape rouge sur un parcours sain.
# ⚠️ En syntaxe BLOC, jamais en map de flow (`{ visible: … }`) : Maestro
# l'accepterait, le sous-ensemble YAML d'Argus non — et un exemple se recopie.
# ⚠️ ET FERMER L'ALERTE NE SUFFIT PAS SEUL. Sur iOS le TROUSSEAU survit lui aussi
# à `clearState` : les deux causes rendent le MÊME symptôme — une ancre correcte
# accusée — donc traiter l'une laisse l'autre, et on croit son remède faux. Le
# trousseau est couvert par `clearKeychain` dans `launch-clean.yaml` ; celle-ci
# est à toi.
#
# ⚠️ Tu peux taper dès la première ligne d'une branche : `launch-clean.yaml`
# attend désormais l'ancre de départ, pas seulement la fin des animations. Avant
# ça, une branche qui tapait tout de suite le faisait PENDANT le sas de
# démarrage — 6,4 à 9,3 s mesurés sur un projet réel — et l'échec sortait en
# « Element not found », ce qui se lit comme une ancre manquante.

# ── L'écran de départ ───────────────────────────────────────────────────────
#
# ⚠️ « On DEMANDE l'écran de départ » et « on EST sur l'écran de départ » sont
# deux choses différentes, et la première ne prouve pas la seconde. La branche
# unique d'avant se décidait sur le scénario (`SCREEN_ID === ARGUS_START_SCREEN`)
# et concluait « rien à naviguer » : vrai au premier appel, faux à tous les
# suivants.
#
# ⚠️ ET L'IMBRICATION EST VOULUE. Écrire `true:` et `visible:` dans le MÊME
# `when` demanderait de savoir comment Maestro les combine — un ET supposé, que
# rien ici ne peut mesurer sans device. Déroulé sur les quatre cas, une lecture
# en OU ferait échouer un `goto` vers un autre écran. Deux `when` emboîtés, qui
# ne portent chacun qu'une nature de condition, donnent le ET sans rien supposer.
- runFlow:
    when:
      true: "${(typeof SCREEN_ID === 'undefined' || SCREEN_ID === '' || SCREEN_ID === ARGUS_START_SCREEN) && typeof ARGUS_ANCHOR_HOME !== 'undefined' && ARGUS_ANCHOR_HOME !== ''}"
    commands:
      # 1. On y est : rien à faire. La condition regarde l'ÉCRAN, pas le scénario.
      - runFlow:
          when:
            visible:
              id: ${ARGUS_ANCHOR_HOME}
          commands:
            - assertTrue:
                condition: "${true}"
                label: Écran de départ déjà affiché — rien à naviguer

      # 2. On le demande, mais on n'y est plus : il faut RAMENER l'app.
      - runFlow:
          when:
            notVisible:
              id: ${ARGUS_ANCHOR_HOME}
          commands:
            # ⚠️ UN `back` SUR LA RACINE NE DÉPILE PAS : IL MET L'APP EN
            # ARRIÈRE-PLAN. Sur Android, quand la pile ne contient que la
            # coquille, `- back` sort de l'application — et tout ce qui suit
            # échoue en accusant une ancre parfaitement correcte. Mesuré sur un
            # projet réel : « Element not found: Id matching regex: nav_history »
            # alors que le dump montrait `nav_history` présent.
            # Conditionne donc TOUT `back` à la présence de ce que tu quittes,
            # par exemple `when: notVisible: { id: ${ARGUS_ANCHOR_HOME} }` —
            # l'ancre de départ est le témoin de la coquille.
            #
            # ⚠️ N'APPELLE JAMAIS `goto.yaml` DEPUIS `goto.yaml`. Le geste naturel pour
            #    « ramener d'abord l'app à l'accueil » est `- runFlow: goto.yaml` — il
            #    HÉRITE de SCREEN_ID et boucle. Maestro rejette alors le workspace ENTIER
            #    au démarrage, donc aucune étape n'est fautive et l'échec accuse le
            #    dernier flow lancé, pas le coupable. `make argus-lint` l'attrape avant
            #    le device — mais il parle APRÈS que tu aies écrit le fichier. Inline le
            #    retour dans la branche.
            # ⚠️ CE QUE CETTE BRANCHE COUVRE, ET CE QU'ELLE NE COUVRE PAS.
            # Elle ne s'exécute QUE si l'on demande l'écran de départ — sa
            # condition est `SCREEN_ID === '' || SCREEN_ID === ARGUS_START_SCREEN`.
            # Pour un écran NOMMÉ (`goto` vers `profile`), elle est sautée, et
            # c'est la branche du bas — une par écran — qui décide. Remplir
            # celle-ci n'y changera donc rien.
            # Vécu : un run a rempli ce TODO en croyant traiter le cas général,
            # son écran nommé n'a pas été atteint, et l'échec est sorti trois
            # étapes plus loin en accusant une ancre présente. Coût : un flow
            # rouge et ~160 s de device.
            #
            # ⚠️ `back` EST ANDROID ET WEB UNIQUEMENT. Ce TODO conseillait
            # « un `back` répété ailleurs » pendant que la méthodologie du même
            # scaffold écrit « un flow de retour non gardé passe au vert sur iOS
            # SANS RIEN TESTER ». Deux fichiers livrés ensemble qui se
            # contredisent, et c'est celui qu'on ÉDITE qui avait tort. Sur iOS,
            # reviens par les commandes de l'app (un bouton de retour ancré),
            # ou garde le `back` derrière `when: platform: Android`.
            #
            # TODO(argus): le retour à l'écran de départ, depuis n'importe quel
            # écran — l'onglet d'accueil chez la plupart
            # (`- tapOn: { id: nav_home }`). Mets-le
            # AVANT l'assertion ci-dessous, qui n'est là que pour faire échouer
            # ICI plutôt que trois étapes plus loin, sur une ancre qui n'a rien
            # fait de mal.
            - assertVisible:
                id: ${ARGUS_ANCHOR_HOME}
                label: Retour à l'écran de départ — aucune branche ne le fait dans goto.yaml

# 3. Aucune ancre d'accueil déclarée : on ne peut RIEN vérifier. On le dit,
#    plutôt que de laisser croire à un aiguillage qui aurait eu lieu.
- runFlow:
    when:
      true: "${(typeof SCREEN_ID === 'undefined' || SCREEN_ID === '' || SCREEN_ID === ARGUS_START_SCREEN) && (typeof ARGUS_ANCHOR_HOME === 'undefined' || ARGUS_ANCHOR_HOME === '')}"
    commands:
      - assertTrue:
          condition: "${true}"
          label: Écran de départ supposé atteint — aucune ancre déclarée pour le vérifier

# TODO(argus): une branche par écran de argus.mobile.yaml → screens[]
# QU'UN FLOW PEUT ATTEINDRE SEUL. Certains n'en admettent aucune : voir plus bas.
#
# ⚠️ Écris-la comme un RETOUR, pas comme un aller : si l'onglet n'est atteignable
# que depuis l'accueil, ramène d'abord l'app à l'accueil dans la même branche.
#
# ⚠️ ET CERTAINS ÉCRANS N'ADMETTENT PAS DE BRANCHE — c'est légitime, et le laisser
# implicite fait inventer un remède. Sur une application à données locales,
# `launch-clean.yaml` fait `clearState` avant CHAQUE flow : tout état « plein »
# (une liste qui a des éléments, un historique qui a des entrées) est donc
# inatteignable par navigation — la donnée n'existe pas encore. Il n'est pas
# hors périmètre pour autant : il est atteint par le parcours qui LA CRÉE.
#
# Ce qu'il faut faire, et qui n'est pas d'écrire une branche :
#   · aucune branche `goto` — elle échouerait à tous les coups ;
#   · les assertions de cet écran vivent dans le flow qui crée la donnée
#     (typiquement `journey-critical.yaml`), après la création ;
#   · écris ici, en une ligne, quels écrans sont dans ce cas et pourquoi —
#     sinon le prochain lecteur croira à un oubli et ajoutera la branche.
#
# ⚠️ Un écran dans ce cas reste déclaré dans `screens[]` : c'est le troisième
# écart légitime de la table §2c-bis du SKILL, et `coverage` le comptera visité
# dès que le parcours l'aura traversé.
# - runFlow:
#     when:
#       true: "${SCREEN_ID === 'profile'}"
#     commands:
#       # ⚠️ REDESCENDRE D'ABORD — c'est la règle écrite plus haut, et l'exemple
#       #    la contredisait en tapant l'onglet tout de suite. `goto` est appelé
#       #    au MILIEU d'un flow : l'app peut être sur un écran POUSSÉ, qui ne
#       #    montre aucune barre d'onglets. Le tap échoue alors sur « Element not
#       #    found: Id matching regex: nav_profile » — donc en accusant une ancre
#       #    parfaitement correcte, trois étapes avant la vraie cause. Mesuré sur
#       #    un projet réel : un flow rouge et une passe device à refaire.
#       #    Un retour ancré par écran poussé que ce flow peut avoir ouvert,
#       #    `optional: true` pour ne rien casser quand on est déjà à la racine.
#       - tapOn:
#           id: detail_back
#           optional: true
#           label: Refermer un écran poussé, s'il y en a un
#       - tapOn:
#           id: nav_profile
#           label: Onglet Profil
#       - extendedWaitUntil:
#           visible:
#             id: profile_root
#           timeout: 10000
