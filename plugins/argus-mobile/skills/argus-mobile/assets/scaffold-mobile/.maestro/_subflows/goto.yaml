appId: ${APP_ID}
# ARGUS:OWNED — à toi : l'installeur ne l'écrase ni ne le compare, jamais.
# ⚠️ Un sous-flow DOIT porter une section de configuration, même s'il n'est
# jamais exécuté directement : Maestro valide TOUS les fichiers YAML du
# workspace au démarrage, et rejette celui qui n'en a pas
# (« Config Section Required »). Le glob `flows` de config.yaml décide de ce qui
# s'EXÉCUTE, pas de ce qui se PARSE.
---
# Aiguillage de navigation : amène l'app sur l'écran `${SCREEN_ID}`.
#
# Aucun outil ne peut deviner comment on atteint un écran dans TON app : c'est la
# seule partie du harness qui demande vraiment du travail projet. Chaque branche
# ci-dessous est un `when` sur l'identifiant d'écran déclaré dans
# `argus.mobile.yaml → screens[].id`.
#
# `home` ne demande rien : `launch-clean.yaml` y a déjà mené.
#
# ⚠️ Tu peux taper dès la première ligne d'une branche : `launch-clean.yaml`
# attend désormais l'ancre de départ, pas seulement la fin des animations. Avant
# ça, une branche qui tapait tout de suite le faisait PENDANT le sas de
# démarrage — 6,4 à 9,3 s mesurés sur un projet réel — et l'échec sortait en
# « Element not found », ce qui se lit comme une ancre manquante.

- runFlow:
    when:
      # ⚠️ `startsWith('home')`, pas `=== 'home'`. Le §2c-bis du skill demande une
      # entrée PAR ÉTAT (`home-empty`, `home-filled`) : en le suivant à la lettre,
      # aucun identifiant ne valait plus « home » et cette branche ne matchait
      # jamais. Le gabarit et le sous-flow livré ne se rejoignaient pas.
      true: "${typeof SCREEN_ID === 'undefined' || SCREEN_ID === '' || String(SCREEN_ID).startsWith('home')}"
    commands:
      - assertTrue:
          condition: "${true}"
          label: Écran d'accueil — atteint par le lancement, rien à naviguer

