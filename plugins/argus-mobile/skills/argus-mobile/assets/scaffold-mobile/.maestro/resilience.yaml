appId: ${APP_ID}
# ARGUS:OWNED — à toi : l'installeur ne l'écrase ni ne le compare, jamais.
name: Argus — conditions réelles
tags:
  - argus
  - resilience
---
# Ce qui arrive vraiment aux utilisateurs : permission refusée, réseau coupé,
# téléphone tourné. Les défauts trouvés ici sont ceux qu'aucun test de parcours
# nominal ne verra jamais.
#
# ⚠️ PIÈGE DE PLATEFORME : `setAirplaneMode` et `toggleAirplaneMode` ne
# fonctionnent QUE sur Android. La doc dit qu'ils « passent sans effet » sur iOS
# et sur le web — donc un test de mode avion non gardé passe au VERT sur iOS en
# n'ayant rien testé. C'est un faux vert, pas une limitation bénigne : d'où les
# `when: platform: Android` ci-dessous.
# Même chose pour `back`, supporté sur Android et Web seulement.

# ── 1. Permissions refusées ────────────────────────────────────────────────
# Le parcours le plus souvent cassé, parce que le plus rarement joué à la main.
# `all: deny` force le chemin où l'utilisateur a dit non.
- launchApp:
    clearState: true
    permissions:
      all: deny
      # 579 — PAS `deny` POUR LES NOTIFICATIONS, ET C'EST UNE MESURE. Sur iOS, le
      # pilote de Maestro répond SEUL à leur fenêtre selon cette table, mais ne
      # la reconnaît qu'à son titre ANGLAIS : `deny` la refusait sur un système
      # anglais et la laissait sur un système français, et le nombre de fenêtres
      # à refermer ci-dessous dépendait de la langue. `unset` l'en écarte : la
      # fenêtre reste, et c'est ce flow qui la refuse, dans les deux langues —
      # mesuré. Sur Android, `unset` et `deny` ouvrent les mêmes fenêtres (565).
      notifications: unset
    label: Lancement toutes permissions refusées

- runFlow: _subflows/disable-animations.yaml

# 572 — CE LANCEMENT PEUT OUVRIR DES FENÊTRES DE PERMISSION, et elles recouvrent
# l'accueil : une application qui DEMANDE ses permissions au démarrage en ouvre
# une par permission refusée, et l'attente de l'ancre ci-dessous échouait en
# accusant l'écran. Mesuré sur une application sonde qui en demande six au
# lancement : cinq fenêtres à la suite, l'accueil introuvable sans elles,
# atteint une fois les cinq refusées.
# Le NOMBRE vient du runner, qui le lit dans `permissions.yaml` : une branche
# sans geste déclencheur y dit « demandée au lancement ». Zéro — le cas de
# presque toutes les applications — et ce bloc ne coûte rien. ⚠️ S'il reste une
# fenêtre sur l'accueil, c'est qu'une permission demandée au lancement n'a pas
# sa branche dans `permissions.yaml`.
# ⚠️ 579 — ET CE NOMBRE DÉPEND DE LA PLATEFORME. Sur iOS, ce lancement refuse les
# autres permissions SANS fenêtre — l'application reçoit le refus directement —,
# donc seules les notifications en ouvrent une, et le runner ne compte qu'elles.
# Mesuré sur une sonde qui en demande deux au lancement : une fenêtre sur iOS,
# et en attendre deux faisait échouer ce flow sur la seconde.
- runFlow:
    when:
      true: "${typeof ARGUS_INVITES_AU_LANCEMENT !== 'undefined' && Number(ARGUS_INVITES_AU_LANCEMENT) > 0}"
    commands:
      - repeat:
          times: ${ARGUS_INVITES_AU_LANCEMENT}
          commands:
            - runFlow: _subflows/permission-refuser.yaml

# 🔴 L'ORDRE DE CES DEUX ATTENTES EST UNE MESURE, PAS UN STYLE (460, puis 523).
# `startup.samples` chronomètre la PREMIÈRE attente sur l'ancre qui suit le
# lancement : tout ce qui attend avant elle lui est soustrait, en silence.
# `waitForAnimationToEnd` était ici AVANT, et il absorbait le sas de démarrage —
# relevé 121 ms derrière 5334 ms d'attente sur une app dont le splash tient 2 s,
# ce qui est physiquement impossible. Le 460 avait corrigé cet ordre dans
# `launch-clean.yaml` ; il n'avait pas traversé jusqu'ici, et huit jours ont
# passé avant qu'un run ne le rencontre.
# ⚠️ Les `waitForAnimationToEnd` qui suivent une ROTATION, plus bas, sont à leur
# place : ils ne s'interposent dans aucune mesure de démarrage.
- runFlow:
    when:
      true: "${typeof ARGUS_ANCHOR_HOME !== 'undefined' && ARGUS_ANCHOR_HOME !== ''}"
    commands:
      - extendedWaitUntil:
          visible:
            id: ${ARGUS_ANCHOR_HOME}
          timeout: ${ARGUS_START_TIMEOUT_MS}
          label: L'app reste utilisable sans aucune permission (pas d'écran blanc, pas de crash)

- waitForAnimationToEnd:
    timeout: 5000

# Puis on accorde, et l'app doit se rattraper sans redémarrage.
- setPermissions:
    permissions:
      all: allow
    label: Permissions accordées en cours de session

# ── 2. Rotation ────────────────────────────────────────────────────────────
# Une dimension figée qui porte du texte déborde en paysage. Le flow ne mesure
# pas le débordement (c'est le rôle de test/argus/layout_test.dart) : il vérifie
# que l'écran SURVIT à la rotation, ce qu'un test de widget ne voit pas.
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      true: "${typeof ARGUS_ANCHOR_HOME !== 'undefined' && ARGUS_ANCHOR_HOME !== ''}"
    commands:
      - assertVisible:
          id: ${ARGUS_ANCHOR_HOME}
          label: L'écran survit au passage en paysage
- setOrientation: PORTRAIT
- waitForAnimationToEnd:
    timeout: 5000

# ── 3. Réseau coupé (Android uniquement) ───────────────────────────────────
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: enabled
      - runFlow:
          when:
            true: "${typeof ARGUS_ANCHOR_HOME !== 'undefined' && ARGUS_ANCHOR_HOME !== ''}"
          commands:
            - assertVisible:
                id: ${ARGUS_ANCHOR_HOME}
                label: L'app tient hors ligne (état vide ou message, jamais un crash)
      # TODO(argus): asserte ici TON message hors-ligne, pas seulement l'absence
      # de crash. Un écran figé sans explication est un défaut, même s'il ne
      # plante pas.
      # - assertVisible:
      #     id: offline_banner
      #     label: L'utilisateur est informé de la perte de réseau
      # Rétablir le réseau AVANT de sortir du bloc : un flow qui laisse le mode
      # avion actif casse tous les flows suivants de la session, et le vrai
      # défaut se retrouve masqué par une cascade d'échecs sans rapport.
      - setAirplaneMode: disabled

# ── 4. Retour système (Android uniquement) ─────────────────────────────────
- runFlow:
    when:
      platform: Android
    commands:
      # Retour système depuis l'accueil : ne doit pas laisser d'écran orphelin.
      - back
