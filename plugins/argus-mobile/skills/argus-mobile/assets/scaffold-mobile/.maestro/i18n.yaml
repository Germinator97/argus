appId: ${APP_ID}
# ARGUS:OWNED — à toi : l'installeur ne l'écrase ni ne le compare, jamais.
name: Argus — i18n et formats
tags:
  - argus
  - i18n
---
# Langue, format monétaire, longueur du français.
#
# ⚠️ La locale NE SE CHANGE PAS depuis un flow. `--device-locale` n'existe que
# sur `maestro start-device` et `maestro cloud` — pas sur `maestro test`, et la
# doc précise qu'aucun endroit d'un flow (ni `launchApp`, ni `config.yaml`) ne
# permet de la définir. Le runner démarre donc le device dans la locale de
# `argus.mobile.yaml → locale.deviceLocale`, et ce flow vérifie le RÉSULTAT.
#
# ⚠️ Le débordement dû à la longueur du français ne se voit pas ici : rien ne
# « déborde » au sens de Maestro, le texte est simplement tronqué ou replié, ce
# qui n'échoue nulle part. C'est test/argus/layout_test.dart qui le mesure, à
# 100 %, 130 % et 200 % de taille de texte.

- runFlow: _subflows/launch-clean.yaml

- runFlow:
    when:
      true: "${typeof ARGUS_ANCHOR_HOME !== 'undefined' && ARGUS_ANCHOR_HOME !== ''}"
    commands:
      - extendedWaitUntil:
          visible:
            id: ${ARGUS_ANCHOR_HOME}
          timeout: ${ARGUS_START_TIMEOUT_MS}
          # Sans label, Maestro rapporte « Assert that id: ${…} is visible » —
          # la variable NON substituée, et aucune idée de ce qu'on attendait.
          label: Écran de départ affiché avant de juger la locale

      # TODO(argus): asserte un libellé qui PROUVE la locale, c'est-à-dire un
      # texte qui serait différent en anglais. Un mot identique dans les deux
      # langues ne prouve rien.
      #
      # ⚠️ ENCADRE LE MOTIF, sinon il échoue quoi que tu écrives. Le sélecteur
      # matche le nœud ENTIER, et sur Flutter un nœud ancré fusionne tout le
      # texte qu'il recouvre : relevé sur un projet réel, `nav_history` rend
      # « Historique\nHISTORIQUE ». `text: 'Bienvenue'` ne matche donc que si le
      # nœud ne contient QUE ce mot — ce qui n'arrive presque jamais.
      # Le `(?s)` est nécessaire : sans lui, `.` ne franchit pas le saut de ligne.
      #
      # ⚠️ L'attribut natif `text` est vide sur toute app Flutter (une seule vue
      # native — seule l'horloge système en porte un) ; ce que le sélecteur lit
      # est le libellé d'accessibilité. Regarde ce que ton app rend vraiment :
      # `maestro hierarchy` (ou `maestro studio`).
      # - assertVisible:
      #     text: '(?s).*Bienvenue.*'
      #     label: Interface rendue en français

      # TODO(argus): SI ton app affiche des nombres formatés, asserte-en un.
      #
      # ⚠️ Ce bloc a longtemps présumé une app monétaire — devise, montant
      # d'exemple en FCFA — et il n'y a rien à y écrire pour une app qui
      # n'affiche aucun prix. Ce qui se vérifie ici, c'est un FORMAT dépendant
      # de la locale, quel qu'il soit : montant, date, durée, pourcentage,
      # pluriel. Si ton app n'en affiche aucun, laisse ce bloc commenté et note
      # dans le rapport que la dimension i18n se limite à la langue.
      #
      # Le séparateur de milliers du français est une espace insécable étroite
      # (U+202F) sur les Flutter récents, PAS une espace ordinaire : un
      # `assertVisible` écrit avec une espace normale échoue sans qu'on comprenne
      # pourquoi. Les sélecteurs `text` étant des regex, `\s` couvre les deux.
      #
      # - assertVisible:                       # un montant
      #     text: '(?s).*1\s?234\s?567\s?FCFA.*'
      #     label: Montant formaté en FCFA (séparateur insécable toléré)
      # - assertVisible:                       # ou une date, ou une durée…
      #     text: '(?s).*\d{1,2} (janvier|février|mars|avril|mai|juin|juillet|août|septembre|octobre|novembre|décembre).*'
      #     label: Date rendue en français

      # Clés de traduction manquantes : une clé non résolue se rend en clair.
      # Ce garde attrape les formes les plus courantes.
      # ⚠️ Encadré comme les autres, et ici ça compte double : non encadré, ce
      # motif ne matcherait jamais rien, donc l'assertion passerait quoi qu'il y
      # ait à l'écran. Un `assertNotVisible` mal écrit est VERT par construction
      # — il occupe la place du garde qu'on croyait avoir.
      - assertNotVisible:
          text: '(?is).*(missing[_ ]translation|\[\[.*\]\]|__[A-Z_]+__).*'
          label: Aucune clé de traduction non résolue à l'écran

- runFlow:
    when:
      true: "${typeof ARGUS_ANCHOR_HOME === 'undefined' || ARGUS_ANCHOR_HOME === ''}"
    commands:
      - assertTrue:
          condition: "${true}"
          label: 'SKIP i18n — aucune ancre déclarée dans argus.mobile.yaml'
