# ARGUS:CADRE — au plugin : `install-mobile.sh --update` remplace ce fichier.
# argus-mobile — CI
#
# Trois étages, du moins cher au plus cher. Le premier tourne à chaque PR ;
# les suivants coûtent un émulateur, donc on les cadre.
#
# Versions relevées via l'API GitHub le 19/08/2026 (dernière release de chacune) :
#   actions/checkout          v7.0.1     actions/setup-node   v7.0.0
#   actions/setup-java        v5.7.0     actions/upload-artifact v7.0.1
#   subosito/flutter-action   v2.23.0    android-emulator-runner v2.38.0
#   mobile-dev-inc/action-maestro-cloud  v3.0.1
# ⚠️ Le workflow du skill web est encore sur checkout@v6 / setup-node@v6 : les
# deux ne sont plus alignés. Bumpe-le dans la même passe si tu y touches.
name: argus-mobile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: argus-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ⚠️ LES JOBS SUIVENT `platforms:`, ils ne le supposent plus (point 230).
  # Deux d'entre eux n'ont de sens que sur Android — build APK, émulateur — et
  # tournaient inconditionnellement : sur un projet `platforms: [ios]` ils ne
  # pouvaient que rougir. Et le job iOS, lui, était éteint par un `if: false`
  # écrit en dur, que rien ne reliait à la configuration : l'allumer était un
  # geste manuel dont rien ne rappelait l'existence.
  #
  # Ce job INTERROGE la configuration au lieu d'y grepper — même source que les
  # scripts, donc le geste outillé ne peut pas diverger du geste configuré.
  cadre:
    name: Ce que le projet déclare
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.p.outputs.android }}
      ios: ${{ steps.p.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - id: p
        run: |
          PLATS="$(node scripts/argus/config.mjs --print-platforms)"
          echo "plateformes déclarées : $PLATS"
          case " $PLATS " in
            *" android "*) echo "android=true"  >> "$GITHUB_OUTPUT" ;;
            *) echo "android=false" >> "$GITHUB_OUTPUT"
               echo "::notice::Android non déclaré — e2e-android se saute. La sécurité (secrets, config, CVE, Info.plist) tourne quand même." ;;
          esac
          case " $PLATS " in
            *" ios "*) echo "ios=true" >> "$GITHUB_OUTPUT"
               # ⚠️ ON NE DÉPENSE PAS SON ARGENT À SA PLACE. Un runner macOS coûte
               # ~10× un Linux : le job iOS reste derrière un opt-in explicite,
               # mais l'oubli est désormais SIGNALÉ au lieu d'être silencieux.
               if [ "${{ vars.ARGUS_IOS_CI }}" != "true" ]; then
                 echo "::warning::ios est déclaré mais e2e-ios est éteint. Pose la variable de dépôt ARGUS_IOS_CI=true pour l'activer (runner macOS, ~10x le coût d'un Linux)."
               fi ;;
            *) echo "ios=false" >> "$GITHUB_OUTPUT" ;;
          esac

  # ── Étage 1 : les gardes sans device ────────────────────────────────────
  # Quelques secondes, aucun émulateur. Couvre les cibles tactiles, les
  # contrastes et la disposition à 130 % et 200 % de taille de texte —
  # précisément ce qu'un flow Maestro ne sait pas exprimer.
  guards:
    name: gardes flutter_test (sans device)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Version de Flutter attendue par le projet
        id: sdk
        # Un projet épinglé par FVM ne compile pas avec la dernière stable, et
        # « channel: stable » dérive tout seul : la CI passe au vert un jour et
        # au rouge le lendemain sans qu'une ligne ait bougé. On lit donc la
        # version dans le projet. Absente, la sortie est vide et l'action
        # retombe sur le channel — le comportement d'avant, pour qui n'épingle pas.
        run: |
          if [ -f .fvmrc ]; then
            v=$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "Version épinglée : ${v:-aucune}"
          fi
      # ⚠️ Pas de `fvm` ici, contrairement au Makefile : l'action installe la
      # version demandée directement dans le PATH du runner. Préfixer les
      # commandes par `fvm` échouerait — il n'est pas installé sur un runner.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          channel: stable
      - run: flutter pub get
      - name: Analyse
        run: flutter analyze
      - name: Gardes a11y et disposition
        run: flutter test test/argus
      # ⚠️ Ces gardes se marquent SKIPPÉES tant que `argusScreens` est vide dans
      # test/argus/harness.dart. Un job vert ne prouve donc rien avant que
      # quelqu'un les ait branchées : lis la sortie, pas seulement la pastille.

  # ── Étage 1 bis : sécurité statique ─────────────────────────────────────
  # Ne demande ni device ni binaire pour le niveau A (sources).
  #
  # ⚠️ CE JOB NE SE CONDITIONNE PLUS À UNE PLATEFORME. Il portait
  # `if: android == 'true'`, ce qui paraissait juste — le niveau B lit un APK —
  # mais il transporte trois choses qui ne dépendent d'AUCUNE plateforme : le
  # scan de secrets, le contrôle des fichiers de config non embarqués, et les
  # CVE des dépendances Dart. Un projet `platforms: [ios]` perdait donc toute
  # la dimension sécurité, et le `::notice::` n'annonçait que la perte des deux
  # qu'il nommait. `sec.mjs` sait déjà ne juger que les plateformes déclarées et
  # DIRE ce qu'il n'a pas jugé : la condition était redondante là où elle avait
  # raison, et destructrice partout ailleurs.
  #
  # ⚠️ ET IL NE CONSTRUIT PLUS D'APK. Il en construisait un en `--debug` pour le
  # « niveau B », alors que le scan REFUSE de conclure sur un debug (il n'y dit
  # rien de la publication) : `--require-tools` transformait ce refus légitime en
  # `exit 2`, si bien que le job échouait par construction, sur un dépôt sain, au
  # premier run. Le build coûtait plusieurs minutes par PR pour un verdict qui
  # n'arrivait jamais. Le niveau B se branche sur une RELEASE — voir le bloc en
  # bas de ce fichier.
  security:
    name: MASVS (sources) et CVE
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Version de Flutter attendue par le projet
        id: sdk
        # Un projet épinglé par FVM ne compile pas avec la dernière stable, et
        # « channel: stable » dérive tout seul : la CI passe au vert un jour et
        # au rouge le lendemain sans qu'une ligne ait bougé. On lit donc la
        # version dans le projet. Absente, la sortie est vide et l'action
        # retombe sur le channel — le comportement d'avant, pour qui n'épingle pas.
        run: |
          if [ -f .fvmrc ]; then
            v=$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "Version épinglée : ${v:-aucune}"
          fi
      # ⚠️ Pas de `fvm` ici, contrairement au Makefile : l'action installe la
      # version demandée directement dans le PATH du runner. Préfixer les
      # commandes par `fvm` échouerait — il n'est pas installé sur un runner.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          channel: stable
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: flutter pub get
      # ⚠️ `latest` SUIT LES PUBLICATIONS AMONT, et ce job est celui dont le sujet
      # est la chaîne d'approvisionnement. Deux runs à un jour d'écart n'analysent
      # donc pas forcément avec le même scanner, et rien dans le rapport ne le
      # dit. Épingle une version dès que tu veux un résultat reproductible —
      # pose la variable de dépôt `ARGUS_OSV_VERSION` (ex. `v2.2.3`) — et le
      # numéro employé est imprimé ci-dessous dans tous les cas.
      - name: Installer osv-scanner
        run: |
          V="${{ vars.ARGUS_OSV_VERSION }}"
          URL="https://github.com/google/osv-scanner/releases/${V:+download/$V}${V:-latest/download}/osv-scanner_linux_amd64"
          curl -sSfL -o /usr/local/bin/osv-scanner "$URL"
          chmod +x /usr/local/bin/osv-scanner
          echo "osv-scanner : $(osv-scanner --version | head -1)  (source ${V:-latest})"
      # Niveau A seulement : manifeste, Info.plist, secrets versionnés, fichiers
      # de configuration non embarqués. Le niveau B (binaire livré) n'a pas sa
      # place ici — il exige la release, pas le paquet de test.
      - name: MASVS statique (sources)
        run: node scripts/argus/sec.mjs
      # `--require-tools` reste ICI, et il y garde tout son sens : sans
      # osv-scanner, la dimension CVE rendrait vert en n'ayant rien scanné —
      # le faux vert le plus coûteux du lot, puisqu'il porte sur la sécurité.
      - name: CVE des dépendances
        run: node scripts/argus/sca.mjs --require-tools
      - name: Rapport
        if: ${{ !cancelled() }}
        run: node scripts/argus/report.mjs
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: argus-mobile-security
          path: argus-mobile-report/
          retention-days: 14
          if-no-files-found: warn

  # ── Étage 2 : la suite Maestro sur émulateur Android ────────────────────
  e2e-android:
    name: e2e Android (émulateur)
    needs: cadre
    if: needs.cadre.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # L'émulateur exige l'accélération matérielle : sans KVM, il démarre en
      # ARM émulé et la suite dépasse tous les timeouts.
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17' # Maestro exige Java 17+
      - name: Version de Flutter attendue par le projet
        id: sdk
        # Un projet épinglé par FVM ne compile pas avec la dernière stable, et
        # « channel: stable » dérive tout seul : la CI passe au vert un jour et
        # au rouge le lendemain sans qu'une ligne ait bougé. On lit donc la
        # version dans le projet. Absente, la sortie est vide et l'action
        # retombe sur le channel — le comportement d'avant, pour qui n'épingle pas.
        run: |
          if [ -f .fvmrc ]; then
            v=$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "Version épinglée : ${v:-aucune}"
          fi
      # ⚠️ Pas de `fvm` ici, contrairement au Makefile : l'action installe la
      # version demandée directement dans le PATH du runner. Préfixer les
      # commandes par `fvm` échouerait — il n'est pas installé sur un runner.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          channel: stable
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - run: flutter pub get
      - run: flutter build apk --debug

      # ⚠️ VERSION NON ÉPINGLÉE, et ce n'est pas anodin ici : le runner LIT les
      # formats de sortie de Maestro (`commands.json`, `manifest.json`, la place
      # de `metadata.status`), relevés sur 2.8.0 et cités à sept endroits du
      # code. Une montée amont qui les change ferait rendre zéro finding sur une
      # suite rouge — le garde `failedRuns > 0 && findings.length === 0` rattrape
      # le cas, mais en `exit 2` sans diagnostic. La version installée est donc
      # IMPRIMÉE : c'est ce qui permet de relire un rapport passé.
      - name: Installer Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      # Contrôle de syntaxe AVANT de démarrer l'émulateur : une erreur de flow
      # se voit en deux secondes plutôt qu'après cinq minutes de boot.
      # ⚠️ `check-syntax` prend UN fichier à la fois, pas un dossier.
      - name: Syntaxe des flows
        run: |
          set -e
          for f in .maestro/*.yaml .maestro/_subflows/*.yaml; do
            [ "$(basename "$f")" = config.yaml ] && continue
            maestro check-syntax "$f"
          done

      # ⚠️ L'ÉMULATEUR SE DÉRIVE DE `argus.mobile.yaml`, IL NE SE FIGE PAS ICI.
      # Une capture de référence est liée au COUPLE appareil + version d'OS.
      # Figées dans ce fichier, ces valeurs n'avaient aucun rapport avec
      # l'appareil du projet : la dimension visuelle était rouge en permanence en
      # CI, pour une raison qui n'est pas une régression. Et ce fichier appartient
      # au CADRE — l'éditer pour l'accorder le faisait déclarer « en retard » par
      # `install-mobile.sh --check`, si bien que la seule issue en cassait une
      # autre. Dérivé, il n'y a plus rien à éditer.
      - name: Appareil déclaré par le projet
        id: appareil
        run: |
          # ⚠️ `set -e` explicite : le code de sortie d'un `run:` est celui de sa
          # DERNIÈRE commande, donc le `cat` final avalait l'échec du node et le
          # job continuait avec un `api-level` vide. Mesuré — le step rendait 0
          # sur une config illisible comme sur une config saine.
          set -euo pipefail
          node -e "
            import('./scripts/argus/config.mjs').then(({ loadConfig, ciEmulator }) => {
              const r = ciEmulator(loadConfig());
              if (r.why) console.error('[argus-mobile] ' + r.why);
              if (!r.ok) process.exit(2);
              console.error('[argus-mobile] émulateur : ' + r.source);
              console.log('api-level=' + r.apiLevel);
              console.log('profile=' + r.profile);
              console.log('avd-name=' + (r.avdName || ''));
            });
          " >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Suite Argus Mobile
        uses: reactivecircus/android-emulator-runner@v2
        env:
          QA_USER: ${{ secrets.QA_USER }}
          QA_PASS: ${{ secrets.QA_PASS }}
        with:
          api-level: ${{ steps.appareil.outputs.api-level }}
          profile: ${{ steps.appareil.outputs.profile }}
          # ⚠️ L'AVD PORTE LE NOM QUE LA CONFIG DÉCLARE. Sans cette ligne,
          # l'action créait un AVD sous son propre nom pendant que le runner
          # cherchait celui de `devices[].avd` — la configuration que le
          # scaffold exige EN MAJUSCULES était donc celle qui faisait échouer le
          # job. `model` et `os` étaient dérivés depuis longtemps ; c'est la
          # troisième clé du même triplet qui manquait, et son absence ne
          # ressemble pas à un oubli puisque les deux autres sont là.
          # Le repli est le défaut de l'action, pour qui ne nomme aucun AVD.
          avd-name: ${{ steps.appareil.outputs.avd-name || 'test' }}
          # `target` et `arch` restent ici : ce sont des choix de RUNNER (image
          # système, architecture de l'hôte), pas des propriétés de l'appareil
          # que le projet déclare. Rien à dériver.
          target: google_apis
          arch: x86_64
          # La locale se fige au démarrage du device : `maestro test` n'a pas de
          # `--device-locale`, et aucun flow ne peut la changer.
          emulator-options: >-
            -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
            -change-locale fr-FR
          script: node scripts/argus/run.mjs --platform=android

      - name: Mesures de performance
        if: ${{ !cancelled() }}
        run: node scripts/argus/perf.mjs || true

      # ⚠️ APRÈS `perf`, et ce n'est pas indifférent : `argus-perf` laisse l'app
      # arrêtée, et `a11y.mjs` sait s'en rattraper (il relance et relit). C'est
      # l'ordre que la chaîne `make argus` emprunte déjà.
      # Cette dimension était livrée, documentée et testée dans les deux sens —
      # et lancée par AUCUN job : la seule du lot dans ce cas.
      - name: Accessibilité sur device
        if: ${{ !cancelled() }}
        run: node scripts/argus/a11y.mjs || true

      - name: Rapport
        if: ${{ !cancelled() }}
        run: node scripts/argus/report.mjs

      # ⚠️ NE PAS publier `--debug-output` en artefact ouvert : `label:` masque
      # les secrets en console et dans les rapports, mais la doc Maestro précise
      # que les valeurs restent en clair dans les journaux de debug bruts.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: argus-mobile-report
          path: |
            argus-mobile-report/report.html
            argus-mobile-report/*.json
            argus-mobile-report/*.xml
            argus-mobile-report/maestro/**/screenshots/**
            argus-mobile-report/maestro/**/startRecording/**
          retention-days: 14
          if-no-files-found: warn

  # ── Étage 2 bis : iOS, optionnel ────────────────────────────────────────
  # ⚠️ IL ÉTAIT ÉTEINT PAR UN `if: false` ÉCRIT EN DUR, que rien ne reliait à
  # `platforms:` — l'allumer était un geste manuel dont rien ne rappelait
  # l'existence. Il suit désormais la configuration, ET un opt-in explicite :
  # un runner macOS coûte ~10× un Linux, et ce n'est pas à ce workflow de
  # dépenser à ta place. Ce qui change, c'est qu'un oubli est SIGNALÉ.
  e2e-ios:
    name: e2e iOS (simulateur)
    needs: cadre
    if: needs.cadre.outputs.ios == 'true' && vars.ARGUS_IOS_CI == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Version de Flutter attendue par le projet
        id: sdk
        # Un projet épinglé par FVM ne compile pas avec la dernière stable, et
        # « channel: stable » dérive tout seul : la CI passe au vert un jour et
        # au rouge le lendemain sans qu'une ligne ait bougé. On lit donc la
        # version dans le projet. Absente, la sortie est vide et l'action
        # retombe sur le channel — le comportement d'avant, pour qui n'épingle pas.
        run: |
          if [ -f .fvmrc ]; then
            v=$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "Version épinglée : ${v:-aucune}"
          fi
      # ⚠️ Pas de `fvm` ici, contrairement au Makefile : l'action installe la
      # version demandée directement dans le PATH du runner. Préfixer les
      # commandes par `fvm` échouerait — il n'est pas installé sur un runner.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          channel: stable
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: flutter pub get
      - run: flutter build ios --debug --simulator
      # ⚠️ VERSION NON ÉPINGLÉE, et ce n'est pas anodin ici : le runner LIT les
      # formats de sortie de Maestro (`commands.json`, `manifest.json`, la place
      # de `metadata.status`), relevés sur 2.8.0 et cités à sept endroits du
      # code. Une montée amont qui les change ferait rendre zéro finding sur une
      # suite rouge — le garde `failedRuns > 0 && findings.length === 0` rattrape
      # le cas, mais en `exit 2` sans diagnostic. La version installée est donc
      # IMPRIMÉE : c'est ce qui permet de relire un rapport passé.
      - name: Installer Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version
      - name: Démarrer un simulateur
        run: maestro start-device --platform ios --device-locale fr_FR
      - name: Suite Argus Mobile
        env:
          QA_USER: ${{ secrets.QA_USER }}
          QA_PASS: ${{ secrets.QA_PASS }}
        run: node scripts/argus/run.mjs --platform=ios
      - name: Rapport
        if: ${{ !cancelled() }}
        run: node scripts/argus/report.mjs
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: argus-mobile-report-ios
          path: argus-mobile-report/
          retention-days: 14
          if-no-files-found: warn

# ═══════════════════════════════════════════════════════════════════════════
# BASELINES VISUELLES — le même piège que côté web
# ═══════════════════════════════════════════════════════════════════════════
# Une capture de référence est liée au COUPLE device + version d'OS. Générée sur
# ton simulateur, elle ne correspondra JAMAIS au rendu de l'émulateur ci-dessus,
# et la dimension visuelle sera rouge en permanence.
#
# Le job ci-dessus DÉRIVE son émulateur de `devices[]` d'argus.mobile.yaml, donc
# générer sur l'appareil que le projet déclare suffit à ce que les deux
# correspondent — il n'y a plus de couple à recopier de part et d'autre :
#
#   node scripts/argus/run.mjs --update-baselines
#
# puis commite `.maestro/_baselines/<device-id>/`. Ne lance JAMAIS
# `--update-baselines` dans ce workflow : une baseline régénérée en CI accepte
# la régression qu'elle était censée détecter.
#
# ⚠️ Le runner GRAVE l'appareil à côté des références (`.argus-device`, lu sur
# l'appareil et non recopié de la config) et avertit quand le run en cours tourne
# sur un autre. Sans ça, une référence née ailleurs échoue en se faisant passer
# pour une régression de l'app — les deux images sont valides, elles ne montrent
# simplement pas le même appareil.
#
# ═══════════════════════════════════════════════════════════════════════════
# NIVEAU B — l'analyse du BINAIRE LIVRÉ, sur une release
# ═══════════════════════════════════════════════════════════════════════════
# Le job `security` ci-dessus ne lit que les SOURCES. Le niveau B — manifeste
# fusionné, permissions héritées des dépendances, obfuscation, drapeau
# debuggable — ne conclut que sur ce qu'on publie : `sec.mjs` refuse un debug,
# et il a raison de le faire.
#
# Le brancher demande deux choses que ce workflow ne peut pas deviner : la
# commande de release DE TON PROJET (souvent `--obfuscate --split-debug-info`,
# un `--dart-define-from-file`, une signature) et le moment où la payer. Sur un
# tag, typiquement, pas à chaque PR :
#
#   niveau-b:
#     name: MASVS (binaire livré)
#     if: startsWith(github.ref, 'refs/tags/')
#     runs-on: ubuntu-latest
#     steps:
#       - uses: actions/checkout@v7
#       - uses: subosito/flutter-action@v2
#         with:
#           channel: stable
#       - uses: actions/setup-node@v7
#         with:
#           node-version: '20'
#       - run: flutter pub get
#       - run: flutter build apk --release --obfuscate --split-debug-info=build/symbols
#       - run: node scripts/argus/sec.mjs --binary=build/app/outputs/flutter-apk/app-release.apk --require-tools
#
# ⚠️ `--require-tools` a ici son sens plein : sur une release, un scan qui ne
# conclut pas est un défaut d'environnement (unzip ou aapt2 absent), jamais une
# décision du code. Déclare aussi `build.androidScan` dans argus.mobile.yaml
# pour que `argus-perf` pèse le bon binaire.
