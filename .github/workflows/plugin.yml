# CI du plugin lui-même — à ne pas confondre avec le workflow que le scaffold
# installe chez le projet d'accueil (plugins/argus-mobile/skills/argus-mobile/assets/…/argus-mobile.yml).
#
# Elle ne teste pas les harness : elle vérifie que ce que le plugin DISTRIBUE
# est cohérent. Sans elle, tools/check-scaffold.sh n'aurait aucun lecteur, et
# un garde que personne n'exécute ne garde rien.
name: plugin

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scaffold:
    name: Cohérence du scaffold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Classification lue par l'installeur
        run: bash tools/check-scaffold.sh

      - name: Syntaxe des installeurs
        run: |
          bash -n plugins/argus-web/skills/argus/scripts/install.sh
          bash -n plugins/argus-mobile/skills/argus-mobile/scripts/install-mobile.sh

      - name: Installation à blanc, puis --check
        run: |
          mkdir -p /tmp/host && printf 'name: host\n' > /tmp/host/pubspec.yaml
          bash plugins/argus-mobile/skills/argus-mobile/scripts/install-mobile.sh /tmp/host
          bash plugins/argus-mobile/skills/argus-mobile/scripts/install-mobile.sh /tmp/host --check

      # Le .gitignore est le seul fichier de l'hôte où l'installeur ÉCRIT. Il
      # ne doit rien dupliquer en se rejouant, et ne rien perdre de ce qui était
      # là — les deux moitiés comptent, et corriger la première casse
      # facilement la seconde.
      - name: Le bloc gitignore se fusionne sans dupliquer ni écraser
        run: |
          mkdir -p /tmp/gi && printf 'name: gi\n' > /tmp/gi/pubspec.yaml
          printf '# a moi\nbuild/\n' > /tmp/gi/.gitignore
          bash plugins/argus-mobile/skills/argus-mobile/scripts/install-mobile.sh /tmp/gi
          bash plugins/argus-mobile/skills/argus-mobile/scripts/install-mobile.sh /tmp/gi
          bash plugins/argus-mobile/skills/argus-mobile/scripts/install-mobile.sh /tmp/gi --update
          blocs=$(grep -c 'début du bloc géré' /tmp/gi/.gitignore)
          [ "$blocs" = 1 ] || { echo "✖ $blocs blocs au lieu d'un : la fusion duplique"; exit 1; }
          grep -q '# a moi' /tmp/gi/.gitignore \
            || { echo "✖ le contenu du projet a disparu"; exit 1; }
          grep -q 'argus-mobile-report' /tmp/gi/.gitignore \
            || { echo "✖ le bloc n'a pas été écrit"; exit 1; }

      - name: Un homonyme du projet n'est jamais écrasé
        run: |
          mkdir -p /tmp/own && printf 'name: own\n' > /tmp/own/pubspec.yaml
          printf 'build:\n\t@echo mine\n' > /tmp/own/Makefile
          bash plugins/argus-mobile/skills/argus-mobile/scripts/install-mobile.sh /tmp/own
          bash plugins/argus-mobile/skills/argus-mobile/scripts/install-mobile.sh /tmp/own --update
          grep -q 'echo mine' /tmp/own/Makefile \
            || { echo "✖ le Makefile du projet a été écrasé"; exit 1; }

      - name: Les scripts du harness parsent
        run: |
          for f in plugins/argus-mobile/skills/argus-mobile/assets/scaffold-mobile/scripts/argus/*.mjs; do
            node --check "$f"
          done

      # ⚠️ `node --check` prouve qu'un fichier PARSE, pas qu'il se charge : il a
      # laissé passer un script dont le garde de point d'entrée utilisait un
      # symbole jamais importé. Le charger vraiment est ce qui le dit — et au
      # passage, ça exige que chacun soit importable SANS effet de bord, ce qui
      # est la condition pour que ses décisions soient testables.
      - name: Les scripts du harness s'importent, sans rien lancer
        run: |
          for f in plugins/argus-mobile/skills/argus-mobile/assets/scaffold-mobile/scripts/argus/*.mjs; do
            node --input-type=module -e "await import('$GITHUB_WORKSPACE/$f')"
          done

      # `node --check` prouve qu'un fichier parse, jamais qu'il décide juste.
      # Deux défauts ont vécu sous cette seule étape : un rapport qui recopiait
      # l'identité du device au lieu de la lire, et un échec qui accusait
      # l'ancre quand l'app démarrait trop lentement.
      - name: Les décisions du runner
        run: node --test tools/run-guards.test.mjs

      # Et l'étage au-dessus : un garde vert ne prouve rien tant qu'on ne l'a
      # pas vu rougir. Celui-ci réintroduit chaque défaut et exige que le garde
      # correspondant tombe — sinon les quinze au-dessus pourraient se vider en
      # silence, ce qui est le seul mode de panne qu'une suite verte ne dit pas.
      - name: Les gardes du runner gardent encore
        run: python3 tools/mutate-run-guards.py

  # ── L'étage 1 compile-t-il seulement ? ──────────────────────────────────
  # Rien ici ne compilait le Dart, et ça s'est vu : la séparation du harnais en
  # trois fichiers a d'abord produit un CYCLE d'imports que Dart résout mal —
  # chaque nom du cadre « défini dans les deux bibliothèques », plus rien qui
  # compile. Aucune étape de cette CI ne pouvait le voir ; il a fallu monter un
  # projet Flutter à la main.
  #
  # On le monte donc ici, à partir de rien : `flutter create` puis la copie du
  # scaffold, exactement ce que l'installeur fait chez l'utilisateur. Le
  # reproduire est le seul moyen d'éprouver un montage — le lire ne suffit pas.
  harness:
    name: L'étage 1 analyse et tourne
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Un projet d'accueil, neuf
        run: |
          flutter create -e /tmp/accueil
          cd /tmp/accueil && flutter pub add dev:flutter_test --sdk=flutter

      - name: Le scaffold, tel que l'installeur le pose
        run: bash plugins/argus-mobile/skills/argus-mobile/scripts/install-mobile.sh /tmp/accueil

      # Le scaffold est livré NON BRANCHÉ (`argusScreens` vide) : les suites s'y
      # marquent skippées avec leur raison. C'est donc la compilation qu'on
      # mesure ici, pas un verdict — et c'est précisément ce qui manquait.
      # Le format est un garde à part entière : le workflow que l'installeur pose
      # chez l'utilisateur lance `flutter analyze`, donc un fichier du CADRE non
      # formaté rend SA CI rouge à la minute où elle atterrit — pour du code
      # qu'il n'a pas écrit. Mesuré le 22/08 : trois fichiers livrés ainsi, et
      # ce job ne les voyait pas puisqu'il ne formatait rien.
      # Le critère est total et négatif — « aucun fichier posé n'est à
      # reformater » —, jamais la liste de ceux qu'on a déjà vus.
      - name: Rien de ce qu'il pose n'est à reformater
        run: cd /tmp/accueil && dart format --output=none --set-exit-if-changed test/argus scripts

      - name: Il analyse sans un mot
        run: cd /tmp/accueil && flutter analyze test/argus

      - name: Il tourne, et dit qu'il n'est pas branché
        run: |
          cd /tmp/accueil
          flutter test test/argus 2>&1 | tee /tmp/sortie.txt
          grep -q 'SKIP — aucun écran déclaré' /tmp/sortie.txt \
            || { echo "✖ les suites devraient se déclarer non branchées, avec leur raison"; exit 1; }
