# CI du plugin lui-même — à ne pas confondre avec le workflow que le scaffold
# installe chez le projet d'accueil (skills/argus-mobile/assets/…/argus-mobile.yml).
#
# Elle ne teste pas les harness : elle vérifie que ce que le plugin DISTRIBUE
# est cohérent. Sans elle, tools/check-scaffold.sh n'aurait aucun lecteur, et
# un garde que personne n'exécute ne garde rien.
name: plugin

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scaffold:
    name: Cohérence du scaffold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Classification lue par l'installeur
        run: bash tools/check-scaffold.sh

      - name: Syntaxe des installeurs
        run: |
          bash -n skills/argus/scripts/install.sh
          bash -n skills/argus-mobile/scripts/install-mobile.sh

      - name: Installation à blanc, puis --check
        run: |
          mkdir -p /tmp/host && printf 'name: host\n' > /tmp/host/pubspec.yaml
          bash skills/argus-mobile/scripts/install-mobile.sh /tmp/host
          bash skills/argus-mobile/scripts/install-mobile.sh /tmp/host --check

      - name: Un homonyme du projet n'est jamais écrasé
        run: |
          mkdir -p /tmp/own && printf 'name: own\n' > /tmp/own/pubspec.yaml
          printf 'build:\n\t@echo mine\n' > /tmp/own/Makefile
          bash skills/argus-mobile/scripts/install-mobile.sh /tmp/own
          bash skills/argus-mobile/scripts/install-mobile.sh /tmp/own --update
          grep -q 'echo mine' /tmp/own/Makefile \
            || { echo "✖ le Makefile du projet a été écrasé"; exit 1; }

      - name: Les scripts du harness parsent
        run: |
          for f in skills/argus-mobile/assets/scaffold-mobile/scripts/argus/*.mjs; do
            node --check "$f"
          done

      # `node --check` prouve qu'un fichier parse, jamais qu'il décide juste.
      # Deux défauts ont vécu sous cette seule étape : un rapport qui recopiait
      # l'identité du device au lieu de la lire, et un échec qui accusait
      # l'ancre quand l'app démarrait trop lentement.
      - name: Les décisions du runner
        run: node --test tools/run-guards.test.mjs

      # Et l'étage au-dessus : un garde vert ne prouve rien tant qu'on ne l'a
      # pas vu rougir. Celui-ci réintroduit chaque défaut et exige que le garde
      # correspondant tombe — sinon les quinze au-dessus pourraient se vider en
      # silence, ce qui est le seul mode de panne qu'une suite verte ne dit pas.
      - name: Les gardes du runner gardent encore
        run: python3 tools/mutate-run-guards.py

  # ── L'étage 1 compile-t-il seulement ? ──────────────────────────────────
  # Rien ici ne compilait le Dart, et ça s'est vu : la séparation du harnais en
  # trois fichiers a d'abord produit un CYCLE d'imports que Dart résout mal —
  # chaque nom du cadre « défini dans les deux bibliothèques », plus rien qui
  # compile. Aucune étape de cette CI ne pouvait le voir ; il a fallu monter un
  # projet Flutter à la main.
  #
  # On le monte donc ici, à partir de rien : `flutter create` puis la copie du
  # scaffold, exactement ce que l'installeur fait chez l'utilisateur. Le
  # reproduire est le seul moyen d'éprouver un montage — le lire ne suffit pas.
  harness:
    name: L'étage 1 analyse et tourne
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Un projet d'accueil, neuf
        run: |
          flutter create -e /tmp/accueil
          cd /tmp/accueil && flutter pub add dev:flutter_test --sdk=flutter

      - name: Le scaffold, tel que l'installeur le pose
        run: bash skills/argus-mobile/scripts/install-mobile.sh /tmp/accueil

      # Le scaffold est livré NON BRANCHÉ (`argusScreens` vide) : les suites s'y
      # marquent skippées avec leur raison. C'est donc la compilation qu'on
      # mesure ici, pas un verdict — et c'est précisément ce qui manquait.
      - name: Il analyse sans un mot
        run: cd /tmp/accueil && flutter analyze test/argus

      - name: Il tourne, et dit qu'il n'est pas branché
        run: |
          cd /tmp/accueil
          flutter test test/argus 2>&1 | tee /tmp/sortie.txt
          grep -q 'SKIP — aucun écran déclaré' /tmp/sortie.txt \
            || { echo "✖ les suites devraient se déclarer non branchées, avec leur raison"; exit 1; }
